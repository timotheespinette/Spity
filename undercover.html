<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Undercover</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
:root{--bg:#21182D;--p:#B99BEA;--m:#A66BFF;--g:#7cff6b;--r:#ff4d6d}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:#eef;font:500 18px/1.35 -apple-system,"SF Pro Rounded",system-ui,sans-serif;background:#21182D}
#app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:22px;padding:18px;box-shadow:0 0 24px rgba(185,155,234,.08)}
h1,h2{margin:.2em 0;text-shadow:0 0 14px var(--p)}h1{font-size:clamp(28px,5vw,46px)}h2{font-size:24px}
button{min-height:52px;min-width:52px;border:1px solid var(--p);background:rgba(185,155,234,.12);color:#fff;border-radius:16px;font:700 18px system-ui;padding:0 20px;box-shadow:0 0 14px rgba(185,155,234,.35)}
button:active{transform:scale(.96)}button:disabled{opacity:.35}
button.m{border-color:var(--m);background:rgba(166,107,255,.16);box-shadow:0 0 14px rgba(166,107,255,.45)}
.c{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.top{display:flex;align-items:center;gap:14px;padding-right:70px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(orientation:portrait){.g2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.row2{display:flex;gap:10px;margin-bottom:10px}
input{width:100%;min-height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;padding:0 14px;font-size:18px;margin:4px 0}
.inp{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.pl{min-height:68px}.pl.on{background:var(--m);box-shadow:0 0 22px var(--m)}
.chip{padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.big{font-size:clamp(34px,7vw,64px);font-weight:800;color:var(--p);text-shadow:0 0 20px var(--p)}
.big2{min-height:64px;font-size:22px;min-width:260px}
.card{width:min(420px,90%);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:800;border-radius:24px;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.card small{font-size:18px;font-weight:500}
.card.on{border:2px solid var(--g);box-shadow:0 0 30px var(--g);color:var(--g)}
.hold{min-height:80px;min-width:300px;font-size:22px;touch-action:none}
.tm{font-size:clamp(64px,14vw,120px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--p);text-shadow:0 0 24px var(--p)}
.tm.ur{color:var(--r);text-shadow:0 0 24px var(--r);animation:pu .5s infinite alternate}
@keyframes pu{to{transform:scale(1.1)}}
.mt{margin-top:18px}.lst{max-height:60vh;overflow:auto}
.flip{width:260px;height:340px;perspective:900px}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:fl 1s .6s forwards}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:30px}
.ff{background:linear-gradient(135deg,#4a2a80,#5b3f8f);border:2px solid var(--p);font-size:90px}
.fb{transform:rotateY(180deg);background:rgba(30,10,60,.9);border:2px solid var(--m);box-shadow:0 0 30px var(--m)}
@keyframes fl{to{transform:rotateY(180deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;animation:fi .4s 2s both}
@keyframes fi{from{opacity:0}}
table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
#mu{position:fixed;top:max(10px,env(safe-area-inset-top));right:14px;z-index:20;width:56px;height:56px;padding:0;font-size:24px;border-radius:50%}
.ap{display:flex;gap:8px;align-items:center}.ab{padding:0;min-width:52px;width:52px;border-radius:50%;overflow:hidden;flex:none}.ab+input{flex:1}.pl{display:flex;align-items:center;justify-content:center;gap:8px}.chip .av{margin-right:4px}
</style></head><body>
<button id="mu" data-a="mute">🔊</button><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="spity-avatar.js"></script>
<script>
const av=(n,s=44)=>SpityAvatar.html(n,s);
const $=s=>document.querySelector(s),ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const BASE="Chat|Chien;Café|Thé;Plage|Piscine;Pizza|Quiche;Vélo|Trottinette;Guitare|Violon;Pomme|Poire;Soleil|Lune;Train|Tramway;Avion|Hélicoptère;Football|Rugby;Cinéma|Théâtre;Lait|Crème;Beurre|Margarine;Montre|Horloge;Chaussette|Chaussure;Lunettes|Lentilles;Stylo|Crayon;Livre|Magazine;Piano|Orgue;Hôpital|Clinique;École|Université;Mer|Océan;Rivière|Fleuve;Forêt|Jungle;Voiture|Camion;Moto|Scooter;Roi|Empereur;Sorcier|Magicien;Pirate|Corsaire;Tigre|Lion;Loup|Renard;Fromage|Yaourt;Chocolat|Caramel;Glace|Sorbet;Bière|Vin;Douche|Bain;Savon|Shampoing;Brosse|Peigne;Canapé|Fauteuil;Lit|Hamac;Château|Palais;Pont|Tunnel;Tente|Caravane;Sac à dos|Valise;Ski|Snowboard;Noël|Nouvel An;Instagram|TikTok;Netflix|YouTube;Pompier|Policier".split(';').map(s=>s.split('|'));
let cfg=ls('uc_cfg',{names:['','',''],uc:1,mw:0,timer:120}),custom=ls('uc_words',[]),scores=ls('uc_scores',{}),G=ls('uc_game',null),mute=ls('uc_mute',false),scr='home',msg='';cfg.ph=cfg.ph||[];
let ucNet={role:'none',peer:null,connections:[],conn:null,code:'',index:-1,playerName:'',roleData:null,seen:{},votes:{},seenSent:false};if(new URLSearchParams(location.search).get('sound')==='0')mute=true;
const auto=n=>[Math.max(1,Math.floor(n/4)),n>=6?1:0];
const alive=()=>G.players.map((p,i)=>p.alive?i:-1).filter(i=>i>=0);
// ---------- AUDIO ----------
let AC;const au=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC};
function bp(f,d=.12,t='sine',v=.2,dl=0){if(mute)return;try{const a=au(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+dl;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={tick:()=>bp(880,.1,'square',.12),end:()=>bp(440,.7,'sawtooth',.2),flip:()=>{bp(300,.08,'triangle');bp(620,.1,'triangle',.2,.07)},win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>bp(f,.25,'triangle',.25,i*.14)),elim:()=>[400,300,200,120].forEach((f,i)=>bp(f,.22,'sawtooth',.2,i*.12))};
const mu=()=>$('#mu').textContent=mute?'🔇':'🔊';
// ---------- TIMER ----------
const tm={t:0,id:0,run:0},fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function tdraw(){const e=$('#tm');if(!e)return;e.textContent=fmt(tm.t);e.classList.toggle('ur',tm.run&&tm.t<=10&&tm.t>0);const g=$('#tg');if(g)g.textContent=tm.run?'⏸ Pause':'▶ Démarrer'}
function ttog(){if(tm.run){clearInterval(tm.id);tm.run=0}else{if(tm.t<=0)tm.t=cfg.timer;tm.run=1;tm.id=setInterval(()=>{tm.t--;if(tm.t<=10&&tm.t>0)sfx.tick();if(tm.t<=0){tm.t=0;clearInterval(tm.id);tm.run=0;sfx.end()}tdraw()},1000)}tdraw()}
// ---------- VUES ----------
const rr=(l,k,v)=>`<div class=row><span>${l}</span><span><button data-a=r data-v="${k}-">−</button> <b>${v}</b> <button data-a=r data-v="${k}+">+</button></span></div>`;
const vHome=()=>`<div class=c><h1>🕵️ UNDERCOVER</h1><p>Trouve l'intrus parmi vous.</p>${G&&G.phase!='end'?'<button class="big2" data-a=res>▶ Reprendre la partie</button>':''}<button class="m big2" data-a=setup>🎮 Nouvelle partie</button><button class="big2" data-a=ucjoin>🔢 Rejoindre avec un code</button><div class=row><button data-a=words>📚 Mots</button><button data-a=scores>🏆 Scores</button></div></div>`;
function vSetup(){const n=cfg.names.length,ci=n-cfg.uc-cfg.mw;return `<div class=top><button data-a=home>⬅</button><h1>Nouvelle partie</h1></div><div class=g2><div class=glass><div class=row><h2>Joueurs</h2><span><button data-a=np data-v=-1>−</button> <b>${n}</b> <button data-a=np data-v=1>+</button></span></div><div class=inp>${cfg.names.map((x,i)=>`<div class=ap><button class=ab data-a=av data-v=${i}>${cfg.ph[i]?`<img class=av src="${cfg.ph[i]}" width=52 height=52>`:'📷'}</button><input data-i=${i} maxlength=14 placeholder="Joueur ${i+1}" value="${esc(x)}">${cfg.ph[i]?`<button class=ab data-a=avx data-v=${i}>✕</button>`:''}</div>`).join('')}</div></div><div class=glass><h2>Rôles</h2>${rr('Civils','ci',ci)}${rr('Undercover','uc',cfg.uc)}${rr('Mr. White','mw',cfg.mw)}<div class=row><button data-a=auto>↺ Répartition auto</button></div><button class="big2" data-a=ucroom>📱 Créer un salon téléphone</button><button class="m big2" data-a=start>▶ Lancer en local</button></div></div>`}
function vWords(){return `<div class=top><button data-a=home>⬅</button><h1>Mots</h1></div><div class=g2><div><div class=glass><h2>Ajouter une paire</h2><div class=row2><input id=wc placeholder="Mot Civil"><input id=wu placeholder="Mot Undercover"></div><button data-a=wadd>＋ Ajouter</button></div><div class="glass mt"><div class=row><button data-a=exp>⬇ Exporter en JSON</button><button data-a=imp>⬆ Importer un JSON</button></div><input id=fi type=file accept=".json,application/json" hidden></div></div><div class=glass><h2>Mes mots (${custom.length})</h2><p>+ ${BASE.length} paires de base</p><div class=lst>${custom.map((p,i)=>`<div class=row><span>${esc(p[0])} / ${esc(p[1])}</span><button data-a=wdel data-v=${i}>🗑</button></div>`).join('')||'<p>Aucun mot personnalisé.</p>'}</div></div></div>`}
function vScores(){const L=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return `<div class=top><button data-a=home>⬅</button><h1>🏆 Scores de la soirée</h1></div><div class=glass><table>${L.map(([n,s],i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${av(n,32)} ${esc(n)}</td><td><b>${s} pts</b></td></tr>`).join('')||'<tr><td>Aucune partie jouée.</td></tr>'}</table></div><div class=row><button class=m data-a=rs>Réinitialiser la soirée</button></div>`}
const vDeal=()=>{if(ucNet.role==='host')return `<div class=c><h1>Rôles distribués</h1><p>Chaque joueur consulte son rôle sur son téléphone.</p><div class=glass style=width:100%>${G.players.map((p,i)=>`<p>${esc(p.n)} · ${ucNet.seen[i]?'prêt':'en attente'}</p>`).join('')}</div><button class="m big2" data-a=ucdebate>Commencer le débat</button></div>`;const p=G.players[G.i];return `<div class=c><small>Joueur ${G.i+1}/${G.players.length}</small><h2>Passe l'iPad à</h2><div class=big>${av(p.n,96)}<br>${esc(p.n)}</div><div id=card class=card>•••</div><button id=hold class="m hold">👁 Maintiens pour voir</button><button id=nx data-a=nx ${G.seen?'':'disabled'}>Suivant ➜</button></div>`};
function bindHold(){const b=$('#hold');if(!b)return;const p=G.players[G.i],c=$('#card');b.onpointerdown=e=>{e.preventDefault();c.innerHTML=p.r=='w'?'🎭 Mr. White<br><small>Pas de mot : bluffe !</small>':`<span style="font-size: clamp(30px, 8vw, 50px)">${esc(p.w)}</span>`;c.classList.add('on');if(!G.seen){G.seen=1;$('#nx').disabled=false;sv('uc_game',G)}try{sfx.flip()}catch(x){}};const off=()=>{c.textContent='•••';c.classList.remove('on')};['pointerup','pointercancel','pointerleave'].forEach(ev=>b['on'+ev]=off);b.oncontextmenu=e=>e.preventDefault()}
const vDebate=()=>{tm.t=cfg.timer;return `<div class=top><h1>🗣 Débat — manche ${G.round}</h1></div><div class=g2><div class=glass><h2>Ordre de parole</h2><div class=gr>${G.order.map((i,k)=>`<div class=chip><b>${k+1}.</b> ${av(G.players[i].n,28)} ${esc(G.players[i].n)}</div>`).join('')}</div></div><div class="glass c"><div id=tm class=tm>${fmt(tm.t)}</div><div class=row><button data-a=tt data-v=-30>−30 s</button><button id=tg data-a=tg>▶ Démarrer</button><button data-a=tt data-v=30>+30 s</button></div><button class="m big2" data-a=tov>🗳 Passer au vote</button></div></div>`};
const grid=(l,a,s)=>`<div class=gr>${l.map(i=>`<button class="pl ${s==i?'on':''}" data-a=${a} data-v=${i}>${av(G.players[i].n,32)} ${esc(G.players[i].n)}</button>`).join('')}</div>`;
function vVote(){if(ucNet.role==='host')return `<div class=c><h2>Votes reçus</h2><p>${Object.keys(ucNet.votes).length} / ${alive().length}</p><div class=glass style=width:100%>${G.players.map((p,i)=>p.alive?`<p>${esc(p.n)} · ${ucNet.votes[i]!==undefined?'a voté':'en attente'}</p>`:'').join('')}</div></div>`;const V=G.vote;if(!V)return `<div class=c><h2>Comment voter ?</h2><button class=big2 data-a=vm data-v=s>🗳 Vote secret (Pass-the-iPad)</button><button class="m big2" data-a=vm data-v=d>👆 Élimination directe</button></div>`;
if(V.d)return `<div class=c><h2>Qui est éliminé ?</h2>${grid(alive(),'sel',V.sel)}<button class="m big2" data-a=kill ${V.sel>=0?'':'disabled'}>☠️ Éliminer</button></div>`;
const vi=V.l[V.k],p=G.players[vi];if(V.step=='pass')return `<div class=c><h2>Passe l'iPad à</h2><div class=big>${av(p.n,96)}<br>${esc(p.n)}</div><button class=big2 data-a=vp>Je suis ${esc(p.n)} — Voter</button></div>`;
return `<div class=c><h2>${esc(p.n)}, qui éliminer ?</h2>${grid(alive().filter(i=>i!=vi),'vc')}</div>`}
function vReveal(){const p=G.players[G.last],L={c:'Civil',u:'Undercover',w:'Mr. White'}[p.r],I={c:'🙂',u:'🕵️',w:'🎭'}[p.r];return `<div class=c>${G.tie?'<p>⚖️ Égalité : tirage au sort</p>':''}${av(p.n,96)}<h2>${esc(p.n)} est éliminé…</h2><div class=flip><div class=fc><div class=ff>?</div><div class=fb><span style="font-size:70px">${I}</span><b>${L}</b><small>${p.w?esc(p.w):''}</small></div></div></div>${p.r=='w'&&!G.gd&&ucNet.role!=='host'?`<div class=modal><div class="glass c"><h2>🎭 ${esc(p.n)}, devine le mot des Civils !</h2><input id=gs placeholder="Ton mot…" autocomplete=off><button class="m big2" data-a=guess>Valider</button></div></div>`:`${p.r=='w'&&!G.gd&&ucNet.role==='host'?'<p>En attente de la réponse de Mr. White sur son téléphone…</p>':''}${G.gd?'<p>❌ Mauvaise réponse !</p>':''}<button class=big2 data-a=cont ${p.r=='w'&&!G.gd&&ucNet.role==='host'?'disabled':''}>Continuer ➜</button>`}</div>`}
function vEnd(){const T={c:'🎉 Les Civils gagnent !',b:'🕵️ Les infiltrés gagnent !',w:'🎭 Mr. White a deviné le mot !'},L={c:'Civil',u:'Undercover',w:'Mr. White'};return `<div class=c><h1>${T[G.res]}</h1><div class=glass style=width:100%><p>Civils : <b>${esc(G.cw)}</b> · Undercover : <b>${esc(G.uw)}</b></p><table>${G.players.map((p,i)=>`<tr><td>${av(p.n,32)} ${esc(p.n)}</td><td>${L[p.r]}</td><td>${p.alive?'':'☠️'}</td><td>+${G.pts[i]}</td><td><b>${scores[p.n]||0} pts</b></td></tr>`).join('')}</table></div><div class=row><button class=m data-a=again>🔁 Rejouer</button><button data-a=scores>🏆 Scores</button><button data-a=home>Accueil</button></div></div>`}
// ---------- Multijoueur téléphone Undercover ----------
let ucJoinAvatar=null;
function vUcJoin(){return `<div class=c><h1>Rejoindre Undercover</h1><div class=glass style=width:min(420px,100%)><input id="uc-code" placeholder="Code à 6 chiffres" inputmode="numeric" maxlength="6"><input id="uc-name" placeholder="Ton pseudo" autocomplete="off" maxlength="18"><div class=row><button data-a=ucphoto>Ajouter une photo</button><button data-a=ucphotox>Retirer</button><span id="uc-photo-preview"></span></div><button class="m big2" data-a=ucjoinnow>Rejoindre</button><p>${esc(msg)}</p></div><button data-a=home>Retour</button></div>`}
function vUcLobby(){const n=cfg.names.length,ci=n-cfg.uc-cfg.mw;return `<div class=c><h1>Salon Undercover</h1><p>Les joueurs rejoignent avec leur pseudo et ce code.</p><div class=glass style=width:min(500px,100%)><div class=tm>${ucNet.code}</div><p>${n} joueur(s) connecté(s)</p><div style="text-align:left;margin:10px 0;max-height:25vh;overflow:auto">${cfg.names.map((x,i)=>`<div class=row style="justify-content:flex-start"><button data-a=kick data-v=${i} style="min-width:36px;height:36px;padding:0;border-radius:8px">✕</button> ${av(x,30)} ${esc(x)}</div>`).join('')||'<p>En attente des joueurs…</p>'}</div><hr style="border:0;border-top:1px solid rgba(255,255,255,.2);margin:15px 0">${rr('Civils','ci',ci)}${rr('Undercover','uc',cfg.uc)}${rr('Mr. White','mw',cfg.mw)}<div class=row><button data-a=auto>↺ Répartition auto</button></div><p class=muted>Minimum 3 joueurs.</p><button class="m big2" data-a=start>Distribuer les rôles</button></div><button data-a=home>Annuler</button></div>`}
function createUcRoom(){if(!window.Peer){alert('Le service de connexion ne se charge pas. Vérifie Internet puis réessaie.');return;}ucNet.role='host';ucNet.code=String(Math.floor(100000+Math.random()*900000));ucNet.connections=[];ucNet.seen={};ucNet.votes={};cfg.names=[];cfg.ph=[];ucNet.peer=new Peer('spity-'+ucNet.code);ucNet.peer.on('open',()=>{scr='uclobby';render()});ucNet.peer.on('connection',c=>{c.on('data',d=>ucHostMessage(c,d));c.on('open',()=>ucNet.connections.push(c))});ucNet.peer.on('error',e=>{msg='Connexion impossible : '+e.type;render()})}
function ucHostMessage(c,d){if(d.type==='join'){const name=String(d.name||'').trim().slice(0,18);if(!name||cfg.names.length>=16){c.send({type:'reject',reason:'Pseudo vide ou salon complet.'});return}let i=cfg.names.findIndex(n=>norm(n)===norm(name));if(i>=0){c.ucIndex=i;if(d.avatar){cfg.ph[i]=d.avatar;SpityAvatar.set(name,d.avatar)}c.send({type:'joined',index:i,name:cfg.names[i],names:cfg.names.slice()});if(G&&G.phase!=='end'){const p=G.players[i];if(p)c.send({type:'role',name:p.n,role:p.r,word:p.w||''})}broadcastUcState();render();return}i=cfg.names.length;cfg.names.push(name);cfg.ph.push(d.avatar||null);if(d.avatar)SpityAvatar.set(name,d.avatar);c.ucIndex=i;c.send({type:'joined',index:i,name,names:cfg.names.slice()});if(G&&G.phase!=='end'){const p=G.players[i];if(p)c.send({type:'role',name:p.n,role:p.r,word:p.w||''})}broadcastUcState();render()}if(d.type==='profile'){const i=c.ucIndex;if(i>=0&&i<cfg.names.length){if(d.avatar){cfg.ph[i]=d.avatar;SpityAvatar.set(cfg.names[i],d.avatar)}else{cfg.ph[i]=null;SpityAvatar.remove(cfg.names[i])}render()}}if(d.type==='seen'){ucNet.seen[c.ucIndex]=true;render()}if(d.type==='vote'&&G?.phase==='vote'&&G.players[d.target]?.alive&&d.target!==c.ucIndex){ucNet.votes[c.ucIndex]=Number(d.target);c.send({type:'voted'});const living=alive();if(living.every(i=>ucNet.votes[i]!==undefined)){const tally={};Object.values(ucNet.votes).forEach(i=>tally[i]=(tally[i]||0)+1);const max=Math.max(...Object.values(tally)),top=Object.keys(tally).filter(k=>tally[k]===max);G.tie=top.length>1;elim(Number(shuf(top)[0]))}else render()}if(d.type==='guess'&&G?.phase==='reveal'&&G.players[G.last]?.r==='w'&&c.ucIndex===G.last){G.gd=1;if(norm(d.word)===norm(G.cw))finish('w');else render()}}
function ucPickPhoto(){SpityAvatar.pick(u=>{ucJoinAvatar=u;const p=$('#uc-photo-preview');if(p)p.innerHTML=`<img class=av src="${u}" width=48 height=48>`})}function ucRemovePhoto(){ucJoinAvatar=null;const p=$('#uc-photo-preview');if(p)p.innerHTML=''}
function ucStartJoin(){if(!window.Peer){alert('Le service de connexion ne se charge pas. Vérifie Internet puis réessaie.');return;}const code=$('#uc-code').value.replace(/\D/g,'').slice(0,6),name=$('#uc-name').value.trim();if(code.length!==6||!name)return;ucNet.role='client';ucNet.playerName=name;ucNet.peer=new Peer();ucNet.peer.on('open',()=>{ucNet.conn=ucNet.peer.connect('spity-'+code,{reliable:true});ucNet.conn.on('open',()=>ucNet.conn.send({type:'join',name,avatar:ucJoinAvatar}));ucNet.conn.on('data',ucClientMessage)});ucNet.peer.on('error',e=>{msg='Erreur de connexion : '+e.type;render()});$('#app').innerHTML='<div class=c><h2>Connexion au salon…</h2></div>'}
function ucClientMessage(d){if(d.type==='reject'){ucNet.role='none';scr='ucjoin';msg=d.reason;render();return}if(d.type==='joined'){ucNet.index=d.index;ucNet.playerName=d.name;if(Array.isArray(d.names))cfg.names=d.names;renderUcClient()}if(d.type==='role'){ucNet.roleData=d;ucNet.seenSent=false;ucNet.voted=false;renderUcClient()}if(d.type==='voted'){ucNet.voted=true;renderUcClient()}if(d.type==='state'){ucNet.state=d;if(d.phase!=='vote')ucNet.voted=false;renderUcClient()} }
function broadcastUcState(){if(ucNet.role!=='host'||!G)return;const state={type:'state',names:cfg.names,photos:cfg.ph,phase:G.phase,round:G.round,alive:alive(),order:G.order||[],last:G.last,lastRole:G.last!=null?G.players[G.last].r:null,lastWord:G.last!=null?G.players[G.last].w:'',res:G.res,gd:G.gd||0,vote:G.phase==='vote',winner:G.res};ucNet.connections.forEach(c=>{if(c.open)c.send(state)})}
function broadcastUcRoles(){ucNet.connections.forEach(c=>{const p=G.players[c.ucIndex];if(c.open&&p)c.send({type:'role',name:p.n,role:p.r,word:p.w||''})});broadcastUcState()}
window.ucReveal = (show, e) => {
    if(e) e.preventDefault();
    const c = document.getElementById('client-card');
    if(!c) return;
    if(show) {
        c.style.display = 'flex';
        const r = ucNet.roleData;
        if(!r) return;
        c.innerHTML = r.role === 'w' ? '🎭 Mr. White<br><small>Pas de mot : bluffe !</small>' : `<span style="font-size: clamp(30px, 8vw, 50px)">${esc(r.word)}</span>`;
        c.classList.add('on');
        if(!ucNet.seenSent && ucNet.conn) {
            ucNet.seenSent = true;
            ucNet.conn.send({type:'seen'});
        }
        try{sfx.flip()}catch(x){}
    } else {
        c.textContent = '•••';
        c.classList.remove('on');
    }
};
function renderUcClient(){
    const d=ucNet.state||{},r=ucNet.roleData;
    if(Array.isArray(d.names))cfg.names=d.names;
    if(Array.isArray(d.photos))cfg.ph=d.photos;
    let body='';
    if(!r) body='<p>Connecté. En attente de la distribution des rôles…</p>';
    else if(d.phase==='deal' || !d.phase) {
        body=`<h2>Salut ${esc(r.name)}</h2><p class="muted">Garde ton écran caché.</p>
        <div id="client-card" class="card mt" style="min-height:160px">•••</div>
        <button class="m big2 hold mt" onpointerdown="ucReveal(true,event)" onpointerup="ucReveal(false,event)" onpointercancel="ucReveal(false,event)" onpointerleave="ucReveal(false,event)" oncontextmenu="event.preventDefault()">👁 Maintiens pour voir</button>`;
    }
    else if(d.phase==='debate') {
        body=`<h2>Débat · manche ${d.round}</h2><p>${d.order.map(i=>esc(cfg.names[i])).join(' → ')}</p><p class="muted">Écoute les autres et défends-toi.</p>
        <div id="client-card" class="card mt" style="min-height:100px; display:none">•••</div>
        <button class="hold mt" style="font-size:18px; min-height:48px" onpointerdown="ucReveal(true,event)" onpointerup="ucReveal(false,event)" onpointercancel="ucReveal(false,event)" onpointerleave="ucReveal(false,event)" oncontextmenu="event.preventDefault()">👁 Rappel de mon mot</button>`;
    }
    else if(d.phase==='vote') {
        const opts=(d.alive||[]).filter(i=>i!==ucNet.index);
        body=ucNet.voted?'<h2>Vote enregistré</h2><p>Attends que les autres joueurs aient voté.</p>':`<h2>Vote secret</h2><p>Choisis le joueur que tu souhaites éliminer.</p><div class=gr>${opts.map(i=>`<button class=pl onclick="sendUcVote(${i})">${esc(cfg.names[i])}</button>`).join('')}</div>`;
    }
    else if(d.phase==='reveal') {
        const lastName=cfg.names[d.last]||'';
        if(d.last===ucNet.index&&r?.role==='w'&&!d.gd) {
            body=`<h2>Tu es Mr. White. Devine le mot des Civils.</h2><input id=uc-guess placeholder="Ton mot…"><button class="m big2" onclick="sendUcGuess()">Valider</button>`;
        } else {
            body=`<h2>${esc(lastName)} a été éliminé.</h2><p>Rôle : <b>${d.lastRole==='c'?'Civil':d.lastRole==='u'?'Undercover':'Mr. White'}</b></p>${d.lastWord?`<p>Mot : ${esc(d.lastWord)}</p>`:''}`;
        }
    }
    else if(d.phase==='end') {
        body=`<h1>${d.winner==='c'?'Les Civils gagnent !':d.winner==='w'?'Mr. White a deviné !':'Les infiltrés gagnent !'}</h1>`;
    }
    $('#app').innerHTML=`<div class="c"><div class="brand" style="opacity:0.5; font-size:14px; letter-spacing:2px; margin-bottom:10px">UNDERCOVER</div><div class="glass" style="width:min(500px,100%)">${body}</div></div>`;
}
function sendUcVote(i){ucNet.conn.send({type:'vote',target:i});$('#app').innerHTML='<div class=c><h2>Vote enregistré</h2><p>Attends la fin du vote.</p></div>'}function sendUcGuess(){const word=$('#uc-guess').value.trim();if(word)ucNet.conn.send({type:'guess',word});$('#app').innerHTML='<div class=c><h2>Réponse envoyée</h2><p>Attends le résultat.</p></div>'}
function start(){
    if(ucNet.role==='host'&&cfg.names.length<3){alert('Il faut au moins 3 joueurs connectés.');return}
    const n=cfg.names.length;
    if(cfg.uc+cfg.mw>=n){
        alert("Erreur : Il y a trop d'infiltrés. Il doit y avoir au moins un Civil.");
        return;
    }
    const names=cfg.names.map((x,i)=>x.trim()||'Joueur '+(i+1)),pool=[...BASE,...custom];
    names.forEach((x,i)=>{if(cfg.ph[i])SpityAvatar.set(x,cfg.ph[i])});
    let k;do{k=Math.random()*pool.length|0}while(pool.length>1&&k==ls('uc_last',-1));sv('uc_last',k);
    let [a,b]=pool[k];if(Math.random()<.5)[a,b]=[b,a];
    const roles=shuf([...Array(n-cfg.uc-cfg.mw).fill('c'),...Array(cfg.uc).fill('u'),...Array(cfg.mw).fill('w')]);
    G={players:names.map((x,i)=>({n:x,r:roles[i],w:roles[i]=='c'?a:roles[i]=='u'?b:'',alive:true})),cw:a,uw:b,phase:'deal',i:0,round:1,vote:null,seen:0};
    scr='game';if(ucNet.role==='host'){broadcastUcRoles();}render()
}
// ---------- LOGIQUE ----------
function render(){clearInterval(tm.id);tm.run=0;sv('uc_cfg',cfg);if(G)sv('uc_game',G);if(ucNet.role==='client'){renderUcClient();return}let v;
if(scr=='uclobby')v=vUcLobby();else if(scr=='game')v={deal:vDeal,debate:vDebate,vote:vVote,reveal:vReveal,end:vEnd}[G.phase]();else if(scr==='ucjoin')v=vUcJoin();else v={home:vHome,setup:vSetup,words:vWords,scores:vScores}[scr]();
$('#app').innerHTML=v;$('#app').scrollTop=0;if(scr=='game'){if(G.phase=='deal'&&ucNet.role!=='host')bindHold();if(G.phase=='debate')tdraw();if(ucNet.role==='host')broadcastUcState()}}
const go=s=>{scr=s;msg='';render()};

function chk(){const A=G.players.filter(p=>p.alive),b=A.filter(p=>p.r!='c').length;if(!b)return'c';if(A.length-b<=b)return'b';return null}
function finish(w){G.res=w;G.phase='end';if(!G.sc){G.sc=1;G.pts=G.players.map(p=>{let x=0;if(w=='c'&&p.r=='c')x=2;else if(p.r=='u'&&w=='b'&&p.alive)x=3;else if(p.r=='w'&&(w=='w'||(w=='b'&&p.alive)))x=5;scores[p.n]=(scores[p.n]||0)+x;return x});sv('uc_scores',scores)}render();sfx.win()}
function elim(i){G.players[i].alive=false;G.last=i;G.gd=0;G.vote=null;G.phase='reveal';render();sfx.elim()}
function merge(a){let n=0;const ks=new Set([...BASE,...custom].map(p=>p.join('|').toLowerCase()));for(const p of a){const x=Array.isArray(p)?p:[p&&(p.civil??p.c),p&&(p.undercover??p.u)];if(!x[0]||!x[1])continue;const c=String(x[0]).trim(),u=String(x[1]).trim(),k=c.toLowerCase()+'|'+u.toLowerCase(),k2=u.toLowerCase()+'|'+c.toLowerCase();if(c&&u&&!ks.has(k)&&!ks.has(k2)){ks.add(k);custom.push([c,u]);n++}}sv('uc_words',custom);return n}
const A={home:()=>go('home'),setup:()=>go('setup'),words:()=>go('words'),scores:()=>go('scores'),res:()=>{scr='game';render()},
kick:v=>{
    const i=Number(v);
    cfg.names.splice(i,1);
    cfg.ph.splice(i,1);
    ucNet.connections.forEach(c=>{
        if(c.ucIndex===i){c.send({type:'reject',reason:'Exclu.'});c.close()}
        else if(c.ucIndex>i)c.ucIndex--
    });
    broadcastUcState();
    render()
},
av:v=>SpityAvatar.pick(url=>{cfg.ph[Number(v)]=url;render()}),avx:v=>{const i=Number(v),n=(cfg.names[i]||'').trim();if(n)SpityAvatar.remove(n);cfg.ph[i]=null;render()},
mute:()=>{mute=!mute;sv('uc_mute',mute);mu()},
np:v=>{
    const n=cfg.names.length+Number(v);
    if(n<3||n>16)return;
    v>0?cfg.names.push(''):(cfg.names.pop(),cfg.ph.length=Math.min(cfg.ph.length,cfg.names.length));
    if(cfg.uc+cfg.mw>=n){[cfg.uc,cfg.mw]=auto(n);}
    render()
},
auto:()=>{[cfg.uc,cfg.mw]=auto(cfg.names.length);render()},
r:v=>{const ci=cfg.names.length-cfg.uc-cfg.mw;if(v=='uc+'&&ci>1)cfg.uc++;if(v=='uc-'&&cfg.uc>1)cfg.uc--;if(v=='mw+'&&ci>1)cfg.mw++;if(v=='mw-'&&cfg.mw>0)cfg.mw--;if(v=='ci+'){if(cfg.mw>0)cfg.mw--;else if(cfg.uc>1)cfg.uc--}if(v=='ci-'&&ci>1)cfg.uc++;render()},
start,again:start,
nx:()=>{G.seen=0;G.i++;if(G.i>=G.players.length){G.phase='debate';G.order=shuf(alive())}render()},ucdebate:()=>{G.phase='debate';G.order=shuf(alive());render()},ucroom:createUcRoom,ucjoin:()=>{scr='ucjoin';render()},ucjoinnow:ucStartJoin,ucphoto:ucPickPhoto,ucphotox:ucRemovePhoto,
tg:ttog,tt:v=>{cfg.timer=Math.min(900,Math.max(30,cfg.timer+Number(v)));if(!tm.run){tm.t=cfg.timer;tdraw()}sv('uc_cfg',cfg)},
tov:()=>{G.phase='vote';render()},
vm:v=>{G.tie=0;ucNet.votes={};G.vote=v=='s'?{l:shuf(alive()),k:0,step:'pass',v:{}}:{d:1,sel:-1};render()},
vp:()=>{G.vote.step='pick';render()},
vc:v=>{const V=G.vote;V.v[v]=(V.v[v]||0)+1;V.k++;sfx.flip();if(V.k>=V.l.length){const m=Math.max(...Object.values(V.v)),t=Object.keys(V.v).filter(k=>V.v[k]==m);G.tie=t.length>1;elim(Number(shuf(t)[0]))}else{V.step='pass';render()}},
sel:v=>{G.vote.sel=Number(v);render()},kill:()=>{if(G.vote.sel>=0)elim(G.vote.sel)},
guess:()=>{const g=norm($('#gs').value);G.gd=1;if(g&&g==norm(G.cw))finish('w');else render()},
cont:()=>{const w=chk();if(w)finish(w);else{G.phase='debate';G.order=shuf(alive());G.round++;render()}},
wadd:()=>{const c=$('#wc').value,u=$('#wu').value;msg=merge([[c,u]])?'Paire ajoutée.':'Paire vide ou déjà existante.';render()},
wdel:v=>{custom.splice(Number(v),1);sv('uc_words',custom);render()},
imp:()=>$('#fi').click(),
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(custom,null,1)],{type:'application/json'}));a.download='undercover-mots.json';a.click()},
rs:()=>{if(confirm('Remettre tous les scores à zéro ?')){scores={};sv('uc_scores',scores);render()}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;try{au()}catch(x){}A[b.dataset.a]&&A[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i!=null){cfg.names[Number(t.dataset.i)]=t.value;sv('uc_cfg',cfg)}});
document.addEventListener('change',e=>{if(e.target.dataset.i!=null){const i=Number(e.target.dataset.i),url=SpityAvatar.get(e.target.value);if(url&&!cfg.ph[i]){cfg.ph[i]=url;render()}return}if(e.target.id!='fi')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);msg=merge(Array.isArray(j)?j:j.words||[])+' paire(s) importée(s).'}catch(x){msg='Fichier JSON invalide.'}render()};r.readAsText(f)});
mu();render();
</script></body></html>
