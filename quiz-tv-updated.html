<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21182D"><title>Quiz TV · Spity</title>
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="spity-avatar.js"></script>
<style>
:root{--qbg:#21182D;--qcard:#2E2240;--qline:#49365F;--qfg:#F0ECF5;--qmuted:#B4A6C9;--qviolet:#8D69C8;--qlight:#B99BEA}
*{box-sizing:border-box}body{margin:0;background:var(--qbg);color:var(--qfg);font:15px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--qline);background:var(--qcard);color:var(--qfg);border-radius:13px;padding:10px 14px;font-weight:650}button.primary{background:linear-gradient(135deg,#7352A6,#B99BEA);color:#21182D;border:0}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;background:#1A1324;color:var(--qfg);border:1px solid var(--qline);border-radius:11px;padding:11px 12px;min-width:0}textarea{min-height:150px;resize:vertical}.wrap{max-width:1000px;margin:auto;padding:18px 18px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:900;font-size:26px;letter-spacing:-1px;color:var(--qlight)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button.active{background:#493565;border-color:var(--qlight);color:#fff}.panel{background:var(--qcard);border:1px solid var(--qline);border-radius:20px;padding:17px;margin:12px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:var(--qmuted);font-size:13px}.small{font-size:12px;color:var(--qmuted)}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--qmuted);font-weight:700}.player-row{display:grid;grid-template-columns:42px 1fr 40px;gap:8px;align-items:center;margin:8px 0}.avatar-btn{padding:3px;width:42px;height:42px;border-radius:50%;overflow:hidden}.avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}.mode{display:flex;flex-direction:column;gap:12px;min-height:190px}.mode .grow{flex:1}.tag{display:inline-block;border-radius:99px;padding:4px 9px;background:#493565;color:#e7d8ff;font-size:11px;font-weight:750}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.row>*{min-width:0}.qitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--qline)}.qitem img{width:62px;height:52px;object-fit:cover;border-radius:9px}.qitem .grow{flex:1;min-width:0}.qitem p{margin:2px 0}.game{min-height:100vh;display:flex;flex-direction:column}.gamehead{padding:12px 16px;border-bottom:1px solid var(--qline);display:flex;justify-content:space-between;gap:10px;align-items:center}.gamebody{width:min(900px,100%);margin:auto;padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.score{background:var(--qcard);border:1px solid var(--qline);border-radius:14px;padding:10px;text-align:center}.score.active{border:2px solid var(--qlight);box-shadow:0 0 18px #B99BEA44}.score img,.score .av{margin:0 auto 5px}.score strong{display:block;font-size:24px;color:var(--qlight)}.question{font-size:clamp(23px,4vw,36px);font-weight:850;text-align:center;line-height:1.2}.answerbox{background:#1b342a;border:1px solid #4b9b72;border-radius:16px;padding:16px;text-align:center}.qphoto{max-width:min(100%,460px);max-height:260px;object-fit:contain;border-radius:14px;display:block;margin:0 auto 12px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{min-width:130px}.good{background:#176c48;border-color:#2ba66d}.bad{background:#7b293d;border-color:#b84d66}.buzzer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.buzzer-grid button{min-height:64px;font-size:16px}.power{border:1px solid #a985e2;background:linear-gradient(120deg,#3b2855,#63418b);border-radius:16px;padding:14px;text-align:center;animation:powerIn .55s cubic-bezier(.2,.8,.2,1)}@keyframes powerIn{0%{opacity:0;transform:translateY(15px) scale(.88)}65%{transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:none}}.code{font-size:clamp(32px,8vw,54px);letter-spacing:7px;font-weight:950;color:var(--qlight);text-align:center}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#352748;border:1px solid var(--qlight);border-radius:12px;padding:11px 16px;z-index:100;max-width:90vw;display:none}.hidden{display:none!important}.preview{display:flex;gap:10px;flex-wrap:wrap}.preview img{max-height:90px;border-radius:10px}.turn-form{display:flex;gap:8px}.turn-form input{flex:1}.turn-form button{white-space:nowrap}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice-grid button{min-height:76px;font-size:18px;white-space:normal}
.choice-grid button.selected{outline:3px solid var(--qlight);background:#604581}
.choice-grid button.correct{background:#176c48;border-color:#2ba66d}
.choice-grid button.wrong{background:#7b293d;border-color:#b84d66}
.player-profile{display:flex;gap:8px;align-items:center}
@media(max-width:520px){.choice-grid{grid-template-columns:1fr}}
@media(max-width:650px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.wrap{padding:14px}.gamebody{padding:14px}.score{padding:8px 5px}.score strong{font-size:20px}}
</style></head><body>
<div id="app" class="wrap"></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch{return d}};
const notify=(s)=>{const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>t.style.display='none',3200)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const defaultSet={id:'default_set_1',name:'Culture générale',questions:[{text:'Quelle est la capitale de la Belgique ?',answer:'Bruxelles',category:'Géographie',difficulty:'facile'},{text:'Combien de côtés possède un hexagone ?',answer:'Six',category:'Sciences',difficulty:'facile'},{text:'Qui a peint la Joconde ?',answer:'Léonard de Vinci',category:'Art',difficulty:'moyenne'}]};
let players=read('quiz_players',['Joueur 1','Joueur 2','Joueur 3','Joueur 4']),playersCount=Math.max(2,Math.min(10,Number(read('quiz_players_count',2))||2));
let questionSets=read('quiz_question_sets',[defaultSet]),settings={pts:1,pen:0,perGame:0,...read('quiz_settings',{})};let stats=read('quiz_stats',{games:0,players:{},history:[]});
let tab='play',selectedImage=null,generated=[];let mode=1,active=[],scores=[],qIndex=0,turn=0,buzzer=-1,answered=false,bonus=null,gameTimer=null,selectedChoices=[],choiceAnswers={};
let net={role:'none',peer:null,conn:null,connections:[],roomCode:'',assigned:-1,ready:{},remoteAnswer:null,started:false};
const save=()=>{localStorage.setItem('quiz_players',JSON.stringify(players));localStorage.setItem('quiz_players_count',String(playersCount));localStorage.setItem('quiz_question_sets',JSON.stringify(questionSets));localStorage.setItem('quiz_settings',JSON.stringify(settings));localStorage.setItem('quiz_stats',JSON.stringify(stats))};
function avatar(n,size=40){return window.SpityAvatar?SpityAvatar.html(n,size):`<span class="av" style="width:${size}px;height:${size}px">${esc(n[0]||'?')}</span>`}
function render(){if(net.role==='client')return renderClient();if(tab==='game')return renderGame();if(tab==='lobby')return renderLobby();$('app').innerHTML=`<header class="topbar"><div><div class="brand">spity / QUIZ TV</div><div class="small">Deux modes. Une seule ambiance.</div></div><nav class="nav"><button class="${tab==='play'?'active':''}" onclick="tab='play';render()">Jouer</button><button class="${tab==='bank'?'active':''}" onclick="tab='bank';render()">Questions</button><button class="${tab==='stats'?'active':''}" onclick="tab='stats';render()">Statistiques</button><button class="${tab==='settings'?'active':''}" onclick="tab='settings';render()">Réglages</button></nav></header>${tab==='play'?renderPlay():tab==='bank'?renderBank():tab==='stats'?renderStats():renderSettings()}`}
function renderPlay(){return `<section class="panel"><div class="row"><div><h2>Les joueurs</h2><p class="muted">De 2 à 10 participants. Les photos de Spity sont réutilisées.</p></div><div class="row"><button onclick="changeCount(-1)">−</button><b>${playersCount}</b><button onclick="changeCount(1)">+</button></div></div>${Array.from({length:playersCount},(_,i)=>`<div class="player-row"><button class="avatar-btn" onclick="pickAvatar(${i})">${avatar(players[i]||`Joueur ${i+1}`,36)}</button><input id="player-${i}" value="${esc(players[i]||`Joueur ${i+1}`)}" onchange="setPlayer(${i},this.value)" placeholder="Joueur ${i+1}"><span class="small">${i+1}</span></div>`).join('')}</section><h2>Choisis ton mode</h2><div class="grid2"><section class="panel mode"><div><span class="tag">MODE 01</span><h2>Tour par tour</h2><p class="muted">Chaque joueur reçoit une question à son tour. La réponse est validée par l'organisateur.</p></div><div class="grow field"><label>Dossier de questions</label><select id="set-turn">${setOptions()}</select></div><div class="grid2"><button class="primary" onclick="launch(1)">Sur cet écran</button><button onclick="launchRemote(1)">Avec un code</button></div></section><section class="panel mode"><div><span class="tag">MODE 02</span><h2>Vitesse & buzzer</h2><p class="muted">Tout le monde peut buzzer. Le premier joueur prend la main.</p></div><div class="grow field"><label>Dossier de questions</label><select id="set-buzz">${setOptions()}</select></div><div class="grid2"><button class="primary" onclick="launch(2)">Sur cet écran</button><button onclick="launchRemote(2)">Avec un code</button></div></section><section class="panel mode"><div><span class="tag">MODE 03</span><h2>Quiz rapide · choix multiples</h2><p class="muted">4 propositions par défaut, jusqu'à 6. Plusieurs bonnes réponses possibles. Les réponses rapides et exactes rapportent plus de points.</p></div><div class="grow field"><label>Bibliothèque de questions à choix multiples</label><select id="set-choice">${setOptions(true)}</select></div><div class="grid2"><button class="primary" onclick="launch(3)">Sur cet écran</button><button onclick="launchRemote(3)">Avec un code</button></div></section></div><section class="panel"><h2>Répondre sur son téléphone</h2><p class="muted">Fonctionne aussi à 2 ou 3 joueurs. Un organisateur ouvre le salon, les autres rejoignent avec le code depuis leur téléphone. Le mode écran partagé reste disponible.</p><button onclick="tab='join';renderJoin()">Rejoindre une partie avec un code</button></section>`}
function setOptions(choicesOnly=false){const list=choicesOnly?questionSets.filter(s=>(s.questions||[]).some(q=>Array.isArray(q.options)&&q.options.length>=2)):questionSets;return list.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${(s.questions||[]).length} questions</option>`).join('')||'<option value="">Aucune bibliothèque avec choix multiples</option>'}
function changeCount(d){playersCount=Math.max(2,Math.min(10,playersCount+d));save();render()};function setPlayer(i,v){players[i]=v.trim()||`Joueur ${i+1}`;save()};function pickAvatar(i){SpityAvatar.pick(u=>{SpityAvatar.set(players[i],u);render()})}
function renderJoin(){tab='join';$('app').innerHTML=`<div class="topbar"><div class="brand">spity / QUIZ TV</div><button onclick="tab='play';render()">Retour</button></div><section class="panel"><h1>Rejoindre une partie</h1><p class="muted">Entre le code affiché sur l'écran de l'organisateur et ton pseudo exact.</p><div class="field"><label>Code de la partie</label><input id="join-code" maxlength="6" placeholder="123456" inputmode="numeric"></div><div class="field"><label>Ton pseudo</label><input id="join-name" placeholder="Ton prénom" maxlength="18"></div><div class="field"><label>Photo de profil (facultative)</label><div class="player-profile"><button onclick="pickJoinAvatar()">Ajouter une photo</button><button onclick="removeJoinAvatar()">Retirer</button><span id="join-avatar-preview"></span></div></div><button class="primary" onclick="joinRoom()">Rejoindre</button><p id="join-status" class="muted"></p></section>`}
function renderBank(){const s=questionSets.find(x=>x.id===($('set-manage')?.value||questionSets[0]?.id))||questionSets[0];return `<div class="row"><div><h1>Banque de questions</h1><p class="muted">Ajoute une question, colle une liste entière ou importe un fichier.</p></div><button onclick="tab='play';render()">Retour au jeu</button></div><section class="panel"><div class="row"><select id="set-manage" onchange="render()">${questionSets.map(x=>`<option value="${esc(x.id)}" ${x.id===s?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button onclick="newSet()">+ Dossier</button><button onclick="deleteSet()">Supprimer</button></div>${s?`<div class="field"><label>Nom du dossier</label><input id="set-name" value="${esc(s.name)}" onchange="renameSet(this.value)"></div><h3>Ajouter une question</h3><div class="field"><label>Question</label><input id="new-q" placeholder="Énoncé de la question"></div><div class="field"><label>Réponse</label><input id="new-a" placeholder="Réponse attendue"></div><div class="field"><label>Photo facultative</label><input id="new-photo" type="file" accept="image/*" onchange="readQuestionPhoto(event)"><div id="photo-preview" class="preview">${selectedImage?`<img src="${selectedImage}">`:''}</div></div><button class="primary" onclick="addOne()">Ajouter la question</button><hr style="border-color:var(--qline);margin:20px 0"><h3>Créer une question à choix multiples</h3><p class="muted">Entre 2 et 6 propositions et coche toutes les bonnes réponses.</p><div class="field"><label>Question</label><input id="mc-q" placeholder="Énoncé de la question"></div><div class="field"><label>Nombre de propositions</label><select id="mc-count" onchange="renderMcFields()"><option>4</option><option>2</option><option>3</option><option>5</option><option>6</option></select></div><div id="mc-fields">${mcFields(4)}</div><button class="primary" onclick="addChoiceQuestion()">Ajouter la question à choix multiples</button><hr style="border-color:var(--qline);margin:20px 0"><h3>Importer beaucoup de questions d'un coup</h3><p class="muted">Une question par ligne, au format <b>question | réponse</b>. CSV accepté avec point-virgule, virgule ou tabulation.</p><textarea id="bulk-text" placeholder="Quelle est la capitale de la Belgique ? | Bruxelles&#10;Qui a peint la Joconde ? | Léonard de Vinci"></textarea><div class="row" style="margin-top:9px"><label class="small">Ou choisir un fichier TXT / CSV <input type="file" accept=".txt,.csv,text/plain,text/csv" onchange="readBulkFile(event)"></label><button class="primary" onclick="importBulk()">Importer la liste</button></div><p id="bulk-preview" class="muted"></p><h3 style="margin-top:20px">Questions du dossier (${s.questions.length})</h3>${s.questions.map((q,i)=>`<div class="qitem">${q.image?`<img src="${q.image}">`:''}<div class="grow"><p><b>${esc(q.text)}</b></p><p class="small">${Array.isArray(q.options)?`Choix : ${q.options.map((x,j)=>`${String.fromCharCode(65+j)}. ${esc(x)}`).join(' · ')} · Bonne(s) réponse(s) : ${(q.correct||[]).map(i=>String.fromCharCode(65+i)).join(', ')}`:`Réponse : ${esc(q.answer)}`}</p></div><button onclick="removeQuestion(${i})">✕</button></div>`).join('')||'<p class="muted">Aucune question.</p>'}`:'<p class="muted">Crée un dossier pour commencer.</p>'}</section><section class="panel"><h3>Générer avec Gemini (facultatif)</h3><p class="muted">La génération utilise la clé API enregistrée dans les réglages. L'import manuel fonctionne sans clé.</p><div class="field"><label>Thème</label><input id="ai-theme" placeholder="Ex. Géographie européenne"></div><div class="row"><input id="ai-count" type="number" min="1" max="30" value="10"><button onclick="generateQuestions()">Générer</button></div><div class="row"><button onclick="generateQuestions()">Générer questions classiques</button><button class="primary" onclick="generateChoiceQuestions()">Générer QCM</button></div><div id="ai-result"></div></section>`}
function mcFields(n){return Array.from({length:n},(_,i)=>`<div class="field"><label>Proposition ${i+1} ${i<2?'(obligatoire)':''}</label><div class="row"><input id="mc-opt-${i}" placeholder="Réponse ${i+1}"><label class="small"><input type="checkbox" id="mc-correct-${i}"> Bonne réponse</label></div></div>`).join('')}
function renderMcFields(){const n=Math.max(2,Math.min(6,Number($('mc-count').value)||4));$('mc-fields').innerHTML=mcFields(n)}
function addChoiceQuestion(){const s=currentSet(),text=$('mc-q')?.value.trim(),n=Number($('mc-count')?.value)||4,options=Array.from({length:n},(_,i)=>$('mc-opt-'+i)?.value.trim()||''),correct=Array.from({length:n},(_,i)=>$('mc-correct-'+i)?.checked?i:-1).filter(i=>i>=0);if(!s||!text||options.some(x=>!x)||!correct.length)return notify('Complète la question, toutes les propositions et coche au moins une bonne réponse.');s.questions.push({text,options,correct,category:'Général',difficulty:'moyenne',target:'all'});save();render();notify('Question à choix multiples ajoutée.')}
function currentSet(){return questionSets.find(s=>s.id===$('set-manage')?.value)||questionSets[0]};function newSet(){const n=prompt('Nom du dossier ?');if(!n?.trim())return;questionSets.push({id:'set_'+Date.now(),name:n.trim(),questions:[]});save();render()};function deleteSet(){const s=currentSet();if(!s||!confirm('Supprimer ce dossier ?'))return;questionSets=questionSets.filter(x=>x!==s);if(!questionSets.length)questionSets=[{id:'set_'+Date.now(),name:'Nouveau dossier',questions:[]}];save();render()};function renameSet(n){const s=currentSet();if(s){s.name=n.trim()||s.name;save()}}function addOne(){const s=currentSet(),q=$('new-q').value.trim(),a=$('new-a').value.trim();if(!s||!q||!a)return notify('Complète la question et la réponse.');s.questions.push({text:q,answer:a,image:selectedImage||'',category:'Général',difficulty:'moyenne',target:'all'});selectedImage=null;save();render()};function removeQuestion(i){const s=currentSet();if(s){s.questions.splice(i,1);save();render()}}
function readQuestionPhoto(e){const f=e.target.files?.[0];if(!f)return;if(f.size>8*1024*1024)return notify('Image trop lourde (maximum 8 Mo).');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);selectedImage=c.toDataURL('image/jpeg',.78);$('photo-preview').innerHTML=`<img src="${selectedImage}"><button onclick="selectedImage=null;$('photo-preview').innerHTML='';">Retirer</button>`};im.src=r.result};r.readAsDataURL(f)}
function parseBulk(txt){const out=[];for(const line of txt.split(/\r?\n/)){const l=line.trim();if(!l||l.startsWith('#'))continue;let parts;if(l.includes('\t'))parts=l.split('\t');else if(l.includes('|'))parts=l.split('|');else if(l.includes(';'))parts=l.split(';');else parts=l.split(',');if(parts.length>=2){const q=parts.shift().trim().replace(/^"|"$/g,'');const a=parts.join(' ').trim().replace(/^"|"$/g,'');if(q&&a&&!((/^(question|énoncé|enonce)$/i).test(q)&&/^(réponse|reponse|answer)$/i.test(a)))out.push({text:q,answer:a,category:'Général',difficulty:'moyenne',target:'all'})}}return out}
function importBulk(){const s=currentSet(),qs=parseBulk($('bulk-text').value);if(!s)return;if(!qs.length)return notify('Aucune ligne valide. Utilise : question | réponse');s.questions.push(...qs);save();render();notify(`${qs.length} questions importées.`)}function readBulkFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bulk-text').value=r.result;$('bulk-preview').textContent=`${parseBulk(r.result).length} questions détectées.`};r.readAsText(f)}
async function generateQuestions(){const s=currentSet(),theme=$('ai-theme').value.trim(),key=settings.geminiKey;if(!s||!theme)return notify('Indique un thème.');if(!key)return notify('Ajoute ta clé Gemini dans les réglages.');try{const n=Math.max(1,Math.min(30,Number($('ai-count').value)||10));const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.geminiModel||'gemini-2.5-flash')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:`Génère ${n} questions de quiz en français sur ${theme}. Réponses courtes. JSON avec text et answer.`}]}],generationConfig:{responseMimeType:'application/json',responseSchema:{type:'ARRAY',items:{type:'OBJECT',properties:{text:{type:'STRING'},answer:{type:'STRING'}},required:['text','answer']}}}})});const d=await resp.json();if(!resp.ok)throw Error(d.error?.message||'Erreur API');generated=JSON.parse(d.candidates[0].content.parts[0].text);$('ai-result').innerHTML=`<p class="muted">${generated.length} questions proposées.</p><button class="primary" onclick="addGenerated()">Ajouter les ${generated.length} questions</button>`}catch(e){notify('Génération impossible : '+e.message)}}async function generateChoiceQuestions(){const s=currentSet(),theme=$('ai-theme').value.trim(),key=settings.geminiKey;if(!s||!theme)return notify('Indique un thème.');if(!key)return notify('Ajoute ta clé Gemini dans les réglages.');try{const n=Math.max(1,Math.min(20,Number($('ai-count').value)||10));const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.geminiModel||'gemini-2.5-flash')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:`Crée ${n} questions de quiz en français sur le thème : ${theme}. Chaque question doit avoir 4 propositions distinctes et plausibles. Une ou plusi function renderSettings(){return `<h1>Réglages</h1><section class="panel"><h2>Règles du quiz</h2><div class="grid2"><div class="field"><label>Points par bonne réponse</label><input id="pts" type="number" min="1" max="10" value="${settings.pts}" onchange="settings.pts=Math.max(1,Number(this.value)||1);save()"></div><div class="field"><label>Pénalité au buzzer</label><input id="pen" type="number" min="0" max="3" value="${settings.pen}" onchange="settings.pen=Math.max(0,Number(this.value)||0);save()"></div><div class="field"><label>Questions par partie (0 = toutes)</label><input type="number" min="0" id="per-game" value="${settings.perGame}" onchange="settings.perGame=Math.max(0,Number(this.value)||0);save()"></div></div></section><section class="panel"><h2>Génération Gemini</h2><div class="field"><label>Clé API</label><input id="gemini-key" type="password" value="${esc(settings.geminiKey||'')}" placeholder="AIza..." onchange="settings.geminiKey=this.value;save()"></div><div class="field"><label>Modèle</label><input id="gemini-model" value="${esc(settings.geminiModel||'gemini-2.5-flash')}" onchange="settings.geminiModel=this.value;save()"></div></section><section class="panel"><h2>Sauvegarde</h2><div class="row"><button onclick="exportData()">Exporter dossiers & statistiques</button><label>Importer JSON <input type="file" accept=".json,application/json" onchange="importData(event)"></label></div></section>`}
function exportData(){const b=new Blob([JSON.stringify({version:3,questionSets,players,playersCount,settings:{...settings,geminiKey:''},stats},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spity-quiz-tv.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.questionSets))throw Error('Fichier invalide');questionSets=d.questionSets;players=d.players||players;playersCount=Math.max(2,Math.min(10,d.playersCount||playersCount));settings={...settings,...d.settings};stats=d.stats||d.gameStats||stats;save();render();notify('Sauvegarde importée.')}catch(x){notify(x.message)}};r.readAsText(f)}
function renderStats(){const rows=Object.entries(stats.players||{}).sort((a,b)=>(b[1].wins||0)-(a[1].wins||0));return `<h1>Statistiques</h1><section class="panel"><div class="row"><h2>${stats.games||0} parties terminées</h2><button class="bad" onclick="resetStats()">Réinitialiser</button></div>${rows.map(([n,p])=>`<div class="qitem">${avatar(n,36)}<div class="grow"><b>${esc(n)}</b><p class="small">${p.wins||0} victoire(s) · ${p.correct||0} bonnes réponses sur ${p.answered||0}</p></div></div>`).join('')||'<p class="muted">Aucune statistique pour le moment.</p>'}</section><section class="panel"><h2>Performances</h2>${rows.map(([n,p])=>`<p>${esc(n)} · ${p.games||0} parties · ${p.wins||0} victoires · ${p.answered?Math.round(100*(p.correct||0)/p.answered):0}% de réussite</p>`).join('')||'<p class="muted">Joue quelques parties pour commencer.</p>'}</section>`}

function launch(m){save();mode=m;const id=m===1?$('set-turn').value:m===2?$('set-buzz').value:$('set-choice').value,s=questionSets.find(x=>x.id===id);if(!s?.questions?.length)return notify('Cette bibliothèque ne contient aucune question.');const valid=s.questions.filter(q=>m!==3||Array.isArray(q.options)&&q.options.length>=2&&Array.isArray(q.correct)&&q.correct.length);if(!valid.length)return notify('Aucune question compatible avec ce mode.');active=shuffle(valid).slice(0,settings.perGame>0?settings.perGame:9999);scores=Array(playersCount).fill(0);qIndex=0;turn=0;buzzer=-1;answered=false;tab='game';net.role='none';render();loadQuestion()}
function renderGame(){const q=active[qIndex];$('app').innerHTML=`<div class="game"><header class="gamehead"><button onclick="quitGame()">Quitter</button><div class="brand">QUIZ TV · ${mode===1?'TOUR PAR TOUR':mode===2?'BUZZER':'QUIZ RAPIDE'}</div><div class="small">${qIndex+1}/${active.length}</div></header><main class="gamebody"><div id="scoreboard" class="scores">${players.slice(0,playersCount).map((p,i)=>`<div class="score ${mode===1&&i===turn?'active':''}" id="score-${i}">${avatar(p,34)}<span class="small">${esc(p)}</span><strong id="scoreval-${i}">${scores[i]}</strong></div>`).join('')}</div><div id="power-zone"></div><div class="question" id="question">${esc(q.text)}</div>${(q.image||q.photo||q.cover)?`<img class="qphoto" src="${q.image||q.photo||q.cover}" onclick="window.open(this.src,'_blank')">`:''}<div id="answer-area"></div><div id="game-controls"></div></main></div>`;drawControls();if(net.role==='host')broadcastState()}
function powerFor(q){if(q.power)return q.power;const r=Math.random();if(r<.10)return {type:'bonus',label:'Bonus éclair',description:'+1 point supplémentaire',value:1};if(r<.15)return {type:'shield',label:'Bouclier',description:'Annule une pénalité si la réponse est fausse',value:0};return null}
function loadQuestion(){clearTimeout(gameTimer);if(qIndex>=active.length)return finishGame();buzzer=-1;answered=false;selectedChoices=[];choiceAnswers={};questionStarted=Date.now();net.remoteAnswer=null;bonus=powerFor(active[qIndex]);render();if(bonus){$('power-zone').innerHTML=`<div class="power"><div class="tag">POUVOIR DÉBLOQUÉ</div><h2>${esc(bonus.label)}</h2><p>${esc(bonus.description)}</p></div>`}if(mode===1){$('game-controls').innerHTML=`<p class="muted" style="text-align:center">Au tour de ${esc(players[turn])}</p><div class="controls"><button class="primary" onclick="reveal()">Afficher la réponse</button></div>`}else if(mode===3){$('answer-area').innerHTML='';$('game-controls').innerHTML=`<div class="choice-grid">${active[qIndex].options.map((o,i)=>`<button onclick="toggleChoice(${i})">${esc(o)}</button>`).join('')}</div><div class="controls"><button class="primary" onclick="submitChoices()">Valider mes réponses</button><button onclick="skipQuestion()">Passer</button></div>`}else{$('game-controls').innerHTML=`<div class="buzzer-grid">${players.slice(0,playersCount).map((p,i)=>`<button onclick="buzz(${i})">${esc(p)}<br><span class="small">BUZZER</span></button>`).join('')}</div><div class="controls"><button onclick="skipQuestion()">Passer la question</button></div>`}if(net.role==='host')broadcastState()}
function drawControls(){const q=active[qIndex];if(mode===1)$('game-controls').innerHTML=`<p class="muted" style="text-align:center">Au tour de ${esc(players[turn])}</p><div class="controls"><button class="primary" onclick="reveal()">Afficher la réponse</button></div>`;else if(mode===3)$('game-controls').innerHTML=`<div class="choice-grid">${q.options.map((o,i)=>`<button onclick="toggleChoice(${i})">${esc(o)}</button>`).join('')}</div><div class="controls"><button class="primary" onclick="submitChoices()">Valider mes réponses</button><button onclick="skipQuestion()">Passer</button></div>`;else $('game-controls').innerHTML=`<div class="buzzer-grid">${players.slice(0,playersCount).map((p,i)=>`<button onclick="buzz(${i})">${esc(p)}<br><span class="small">BUZZER</span></button>`).join('')}</div><div class="controls"><button onclick="skipQuestion()">Passer la question</button></div>`}
function toggleChoice(i){if(answered)return;const p=selectedChoices.indexOf(i);if(p>=0)selectedChoices.splice(p,1);else selectedChoices.push(i);document.querySelectorAll('.choice-grid button').forEach((b,j)=>b.classList.toggle('selected',selectedChoices.includes(j)))}
function submitChoices(){if(!selectedChoices.length)return notify('Choisis au moins une proposition.');const correct=active[qIndex].correct||[];const ok=correct.length===selectedChoices.length&&correct.every(i=>selectedChoices.includes(i));const elapsed=Math.max(0,Date.now()-(questionStarted||Date.now()));const speed=Math.max(0,Math.ceil(5*(1-Math.min(elapsed,20000)/20000)));const points=ok?Math.max(1,Number(settings.pts)+speed):0;answered=true;const target=turn;if(ok)scores[target]+=points;const rec=stats.players[players[target]]||{games:0,wins:0,correct:0,answered:0};rec.answered++;if(ok)rec.correct++;stats.players[players[target]]=rec;showChoiceResult(ok,points);if(net.role==='host')broadcastState(true)}
function showChoiceResult(ok,points){const q=active[qIndex];$('answer-area').innerHTML=`<div class="answerbox"><h2>${ok?'Bonne réponse':'Pas tout à fait'}</h2><p>${q.correct.map(i=>esc(q.options[i])).join(' · ')}</p><p>${ok?`+${points} points`:'0 point'}</p></div>`;$('game-controls').innerHTML=`<div class="controls"><button class="primary" onclick="nextQuestion()">Question suivante</button></div>`}
function reveal(){if(mode===2&&buzzer<0)return notify('Personne n’a buzzé.');$('answer-area').innerHTML=`<div class="answerbox"><div class="small">RÉPONSE ATTENDUE</div><h2>${esc(active[qIndex].answer)}</h2></div>`;$('game-controls').innerHTML=`<div class="controls"><button class="good" onclick="validate(true)">Bonne réponse</button><button class="bad" onclick="validate(false)">Mauvaise réponse</button><button onclick="nextQuestion()">Ne pas compter</button></div>`;if(net.role==='host')broadcastState(true)}
function buzz(i){if(buzzer!==-1||answered)return;buzzer=i;notify(`${players[i]} a buzzé !`);$('game-controls').innerHTML=`<p style="text-align:center">${esc(players[i])} a la main.</p><div class="controls"><button class="primary" onclick="reveal()">Afficher la réponse</button></div>`;if(net.role==='host')broadcastState()}
function validate(ok){if(answered)return;answered=true;const target=mode===1?turn:buzzer;if(target>=0){const p=players[target],rec=stats.players[p]||{games:0,wins:0,correct:0,answered:0};rec.answered++;if(ok)rec.correct++;stats.players[p]=rec;if(ok){scores[target]+=Number(settings.pts)+(bonus?.type==='bonus'?1:0);if(bonus?.type==='steal'){const rivals=scores.map((v,i)=>i===target?-1:v),leader=Math.max(...rivals),victim=rivals.findIndex(v=>v===leader);if(victim>=0&&scores[victim]>0){scores[victim]--;scores[target]++}}}else if(mode===2&&bonus?.type!=='shield')scores[target]-=Number(settings.pen)}$('answer-area').innerHTML=`<div class="answerbox"><h2>${ok?'Bonne réponse !':'Mauvaise réponse'}</h2><p>${esc(active[qIndex].answer)}</p></div>`;document.querySelector(`#score-${target} strong`).textContent=scores[target];$('game-controls').innerHTML=`<div class="controls"><button class="primary" onclick="nextQuestion()">Question suivante</button></div>`;if(net.role==='host')broadcastState(true)}
function nextQuestion(){if(mode===1||mode===3)turn=(turn+1)%playersCount;qIndex++;loadQuestion()};function skipQuestion(){if(mode===1||mode===3)turn=(turn+1)%playersCount;qIndex++;loadQuestion()}
function finishGame(){clearTimeout(gameTimer);const max=Math.max(...scores),winners=players.slice(0,playersCount).filter((_,i)=>scores[i]===max);stats.games=(stats.games||0)+1;players.slice(0,playersCount).forEach(n=>{const p=stats.players[n]||{games:0,wins:0,correct:0,answered:0};p.games=(p.games||0)+1;if(winners.includes(n))p.wins=(p.wins||0)+1;stats.players[n]=p});stats.history.unshift({date:new Date().toLocaleString('fr-BE'),mode:mode===1?'Classique':mode===2?'Buzzer':'Quiz rapide',winner:winners.join(', '),scores:players.slice(0,playersCount).map((name,i)=>({name,score:scores[i]}))});save();$('app').innerHTML=`<div class="game"><main class="gamebody"><div class="brand">FIN DE LA PARTIE</div><h1 style="text-align:center">${winners.length>1?'Égalité !':`Victoire de ${esc(winners[0])} !`}</h1><div class="scores">${players.slice(0,playersCount).map((p,i)=>`<div class="score">${avatar(p,36)}${esc(p)}<strong>${scores[i]}</strong></div>`).join('')}</div><button class="primary" onclick="netClose();tab='play';render()">Retour à Quiz TV</button></main></div>`;if(net.role==='host')broadcast({type:'end',scores,winners})}

function makeCode(){return String(Math.floor(100000+Math.random()*900000))}
async function launchRemote(m){if(!window.Peer)return notify('Le service de connexion ne se charge pas. Vérifie Internet.');save();mode=m;const id=m===1?$('set-turn').value:m===2?$('set-buzz').value:$('set-choice').value,s=questionSets.find(x=>x.id===id);if(!s?.questions?.length)return notify('Bibliothèque vide.');const valid=s.questions.filter(q=>m!==3||Array.isArray(q.options)&&q.options.length>=2&&q.correct?.length);if(!valid.length)return notify('Aucune question compatible.');active=shuffle(valid).slice(0,settings.perGame>0?settings.perGame:9999);scores=Array(playersCount).fill(0);qIndex=0;turn=0;buzzer=-1;answered=false;net.role='host';players=[];playersCount=0;scores=[];stats={games:0,players:{},history:[]};save();net.roomCode=makeCode();net.connections=[];net.ready={};tab='lobby';$('app').innerHTML='';net.peer=new Peer('spity-'+net.roomCode,{debug:1});net.peer.on('open',()=>{net.started=false;renderLobby()});net.peer.on('connection',conn=>{conn.on('data',data=>hostMessage(conn,data));conn.on('open',()=>{net.connections.push(conn)})});net.peer.on('error',e=>{notify('Connexion : '+e.type);if(e.type==='unavailable-id'){netClose();launchRemote(m)}})}
function renderLobby(){$('app').innerHTML=`<div class="topbar"><div class="brand">QUIZ TV · SALON</div><button onclick="netClose();tab='play';render()">Annuler</button></div><section class="panel" style="text-align:center"><p class="muted">Fais rejoindre les joueurs avec ce code. Le nombre de joueurs n’a aucune incidence : 2, 3 ou jusqu’à 10.</p><div class="code">${net.roomCode}</div><p class="muted">Chaque joueur doit ouvrir Spity → Quiz TV → Rejoindre avec un code.</p><h2>Joueurs connectés</h2><div id="connected-list">${players.slice(0,playersCount).map((n,i)=>`<p class="muted">${avatar(n,30)} ${esc(n)} · connecté</p>`).join('')||'<p class="muted">En attente des joueurs…</p>'}</div><p class="muted">Minimum 2 joueurs connectés.</p><button class="primary" onclick="startRemoteNow()">Démarrer la partie</button></section>`}
function hostMessage(conn,d){if(d.type==='join'){const name=String(d.name||'').trim().slice(0,18);if(!name||players.slice(0,playersCount).some(n=>n.toLowerCase()===name.toLowerCase())){conn.send({type:'reject',reason:'Pseudo vide ou déjà utilisé.'});return}if(playersCount>=10){conn.send({type:'reject',reason:'Le salon est complet (10 joueurs maximum).'});return}const idx=playersCount;players.push(name);playersCount++;scores.push(0);if(d.avatar&&window.SpityAvatar)SpityAvatar.set(name,d.avatar);conn.spityIndex=idx;conn.send({type:'joined',index:idx,players:players.slice(0,playersCount),mode,name,avatar:d.avatar||''});if(tab==='lobby')renderLobby();else broadcastState()}if(d.type==='answer'&&conn.spityIndex===turn&&mode===1){net.remoteAnswer={index:conn.spityIndex,text:d.text};$('answer-area').innerHTML=`<div class="answerbox"><b>Réponse de ${esc(players[turn])}</b><p>${esc(d.text)}</p></div>`;$('game-controls').innerHTML=`<div class="controls"><button class="good" onclick="validate(true)">Bonne réponse</button><button class="bad" onclick="validate(false)">Mauvaise réponse</button></div>`;broadcastState(true)}if(d.type==='buzz'&&mode===2)buzz(conn.spityIndex);if(d.type==='choices'&&mode===3&&d.qIndex===qIndex&&!answered&&!choiceAnswers[conn.spityIndex]){choiceAnswers[conn.spityIndex]={picked:(d.picked||[]).map(Number),started:d.started||Date.now()};const expected=net.connections.filter(c=>c.open).length;if(Object.keys(choiceAnswers).length>=expected){answered=true;const correct=active[qIndex].correct||[];net.connections.forEach(c=>{const a=choiceAnswers[c.spityIndex];if(!a)return;const ok=correct.length===a.picked.length&&correct.every(i=>a.picked.includes(i));const elapsed=Math.max(0,Date.now()-a.started);const points=ok?Math.max(1,Number(settings.pts)+Math.max(0,Math.ceil(5*(1-Math.min(elapsed,20000)/20000)))):0;if(ok)scores[c.spityIndex]+=points;const rec=stats.players[players[c.spityIndex]]||{games:0,wins:0,correct:0,answered:0};rec.answered++;if(ok)rec.correct++;stats.players[players[c.spityIndex]]=rec;c.send({type:'choice-result',ok,points,correct})});save();broadcastState(true)}}}
function startRemoteNow(){if(playersCount<2)return notify('Il faut au moins 2 joueurs connectés.');net.started=true;tab='game';loadQuestion()}
function broadcast(data){net.connections.forEach(c=>{if(c.open)try{c.send(data)}catch{}})}
function broadcastState(showAnswer=false){const q=active[qIndex];if(!q)return;broadcast({type:'state',mode,qIndex,total:active.length,turn,buzzer,players:players.slice(0,playersCount),scores,question:q.text,options:q.options||[],image:q.image||q.photo||q.cover||'',answer:showAnswer||answered? q.answer:null,answered,answerText:net.remoteAnswer?.text||'',power:bonus,phase:answered?'result':showAnswer?'reveal':'question'})}
function renderClient(){const c=net.conn;$('app').innerHTML=`<div class="brand">spity / QUIZ TV</div><section class="panel"><h2>Connecté · ${esc(net.playerName||'')}</h2><div id="client-state"><p class="muted">En attente de la question…</p></div></section>`}
let joinAvatar=null;function pickJoinAvatar(){SpityAvatar.pick(u=>{joinAvatar=u;$('join-avatar-preview').innerHTML=`<img class=av src="${u}" width=44 height=44>`})}function removeJoinAvatar(){joinAvatar=null;$('join-avatar-preview').innerHTML=''}
function joinRoom(){const code=$('join-code').value.replace(/\D/g,'').slice(0,6),name=$('join-name').value.trim();if(code.length!==6||!name)return notify('Entre un code à 6 chiffres et ton pseudo.');if(!window.Peer)return notify('Connexion indisponible : vérifie Internet.');net.role='client';net.playerName=name;net.peer=new Peer();net.peer.on('open',()=>{net.conn=net.peer.connect('spity-'+code,{reliable:true});net.conn.on('open',()=>net.conn.send({type:'join',name,avatar:joinAvatar}));net.conn.on('data',clientMessage);net.conn.on('error',()=>notify('Connexion interrompue.'))});net.peer.on('error',e=>notify('Erreur de connexion : '+e.type));$('app').innerHTML='<section class="panel"><h2>Connexion…</h2><p class="muted">Recherche du salon.</p></section>'}
function clientMessage(d){if(d.type==='choice-result'){net.choiceResult=d;return}if(d.type==='reject'){netClose();notify(d.reason);tab='join';renderJoin()}if(d.type==='joined'){net.assigned=d.index;net.players=d.players;net.playerName=d.name||net.playerName;renderClient()}if(d.type==='state'){net.state=d;phoneChoices=[];phoneStarted=Date.now();renderClientState(d)}if(d.type==='end'){$('client-state').innerHTML='<h2>Fin de partie</h2><p>'+esc(d.winners.join(', '))+'</p>'}}
function renderClientState(d){if(net.role!=='client')return;const mine=net.assigned,canTurn=d.mode===1&&d.turn===mine&&d.phase==='question'&&!d.answerText,canBuzz=d.mode===2&&d.phase==='question'&&d.buzzer<0&&!d.answered;let html=`<p class="small">Question ${d.qIndex+1}/${d.total}</p><div class="scores">${d.players.map((n,i)=>`<div class="score ${i===d.turn?'active':''}">${esc(n)}<strong>${d.scores[i]}</strong></div>`).join('')}</div>`;if(d.power)html+=`<div class="power"><b>${esc(d.power.label)}</b><p>${esc(d.power.description)}</p></div>`;if(d.mode===3&&d.phase==='question')html+=`<h2 class="question">${esc(d.question)}</h2><div class="choice-grid">${d.options.map((o,i)=>`<button onclick="togglePhoneChoice(${i})" id="phone-choice-${i}">${esc(o)}</button>`).join('')}</div><button class="primary" onclick="sendPhoneChoices()">Valider</button>`;if(d.mode===1&&!canTurn)html+=d.answerText&&d.turn===mine?'<p class="muted">Réponse envoyée. Attends la validation.</p>':'<p class="muted">Ce n’est pas ton tour ou la réponse est déjà verrouillée. Reste prêt.</p>';else{html+=`<h2 class="question">${esc(d.question)}</h2>`;if(d.image)html+=`<img class="qphoto" src="${d.image}">`;if(canTurn)html+=`<div class="turn-form"><input id="phone-answer" placeholder="Ta réponse"><button class="primary" onclick="sendPhoneAnswer()">Envoyer</button></div>`;if(canBuzz)html+=`<button class="primary" style="width:100%;min-height:70px" onclick="sendPhoneBuzz()">BUZZER</button>`;if(d.buzzer===mine)html+='<p class="muted">Tu as buzzé. Attends la validation.</p>'}if(net.choiceResult&&d.mode===3)html+=`<div class="answerbox"><b>${net.choiceResult.ok?'Bonne réponse':'Réponse incorrecte'}</b><p>${net.choiceResult.ok?'+'+net.choiceResult.points+' points':'0 point'}</p></div>`;if(d.answer)html+=`<div class="answerbox"><b>Réponse : ${esc(d.answer)}</b>${d.answerText?`<p>Ta réponse : ${esc(d.answerText)}</p>`:''}</div>`;if(d.answered)html+='<p>Réponse validée.</p>';$('client-state').innerHTML=html}
let phoneChoices=[],phoneStarted=Date.now();function togglePhoneChoice(i){const p=phoneChoices.indexOf(i);if(p>=0)phoneChoices.splice(p,1);else phoneChoices.push(i);document.querySelectorAll('[id^=phone-choice-]').forEach((b,j)=>b.classList.toggle('selected',phoneChoices.includes(j)))}function sendPhoneChoices(){if(!phoneChoices.length)return;net.conn.send({type:'choices',picked:phoneChoices,qIndex:net.state?.qIndex,started:phoneStarted});phoneChoices=[];notify('Réponses envoyées.')}function sendPhoneAnswer(){const text=$('phone-answer').value.trim();if(text)net.conn.send({type:'answer',text})};function sendPhoneBuzz(){net.conn.send({type:'buzz'})}
function netClose(){try{net.connections.forEach(c=>c.close());net.conn?.close();net.peer?.destroy()}catch{}net={role:'none',peer:null,conn:null,connections:[],roomCode:'',assigned:-1,ready:{},remoteAnswer:null,started:false}}
render();
</script></body></html>
