<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spity — Salon</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--fond:url(spity-fond.jpg);--glass:rgba(14,22,70,.42);--line:rgba(255,255,255,.32);
--violet:#7a57f5;--violet-top:#9170ff;--violet-edge:#3f26a8;--sun:#ffc23d;--sun-top:#ffd96e;--sun-edge:#c27f00;
--font:"Baloo 2","Nunito",system-ui,-apple-system,sans-serif;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:var(--font);color:#fff;overflow:hidden;
background:var(--fond) center bottom/cover no-repeat,linear-gradient(#12d9cf,#0a5d8a);background-color:#0a5d8a;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}
.scr{display:none;position:absolute;inset:0;box-sizing:border-box;padding:16px clamp(16px,4vw,44px) 24px;gap:12px}
.scr.on{display:grid}
.btn{padding:14px 26px 16px;border-radius:24px;font-weight:800;font-size:clamp(1.1rem,2.4vw,1.6rem);transition:transform .1s,box-shadow .1s;color:#fff;
background:linear-gradient(180deg,var(--violet-top),var(--violet));box-shadow:0 7px 0 var(--violet-edge)}
.btn.sun{background:linear-gradient(180deg,var(--sun-top),var(--sun));color:#4a2a00;box-shadow:0 7px 0 var(--sun-edge)}
.btn:active{transform:translateY(7px);box-shadow:none}
.glass{background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px}
.fish{display:block;pointer-events:none;filter:drop-shadow(0 12px 16px rgba(0,40,90,.35));animation:fl 5s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(5px) rotate(-1.5deg)}to{transform:translateY(-8px) rotate(1.5deg)}}
h2{margin:0;font-weight:800;font-size:clamp(2rem,6vw,3.6rem);text-align:center;text-shadow:0 4px 18px rgba(0,40,90,.5);line-height:1.05}
.in{width:100%;box-sizing:border-box;padding:12px 18px;border:0;border-radius:22px;background:rgba(255,255,255,.92);color:#12264d;font-weight:800;text-align:center;outline:0}
.in:focus{box-shadow:0 0 0 4px #fff8}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;z-index:3;padding:8px 18px;font-weight:800;color:#fff;text-decoration:none;border-radius:999px}
/* Hôte */
#host{grid-template-columns:1fr min(34vw,40vh) 1fr;grid-template-rows:1fr auto auto;grid-template-areas:"l q r" "c c c" "b f s";align-items:center}
.side{display:grid;grid-template-columns:repeat(2,max-content);gap:3vh 2.5vw;align-content:center;justify-content:center}
#sl{grid-area:l}#sr{grid-area:r}
.qr{grid-area:q;background:#fff;border-radius:26px;padding:14px;box-shadow:0 12px 30px rgba(0,40,90,.35);aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.code{grid-area:c;justify-self:center;white-space:nowrap;padding:6px 34px;font-weight:800;font-size:clamp(2.2rem,7vw,4.4rem);letter-spacing:.14em;line-height:1.1}
#hB{grid-area:b;justify-self:start}#hG{grid-area:s;justify-self:end}
#host .fish{grid-area:f;justify-self:center;height:clamp(70px,15vh,150px);width:auto}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}.pl.old{animation:none}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.av{width:clamp(60px,13vh,130px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ring,#fff);background:#bfeaf7;overflow:hidden;box-shadow:0 8px 20px rgba(0,40,90,.35)}
.av img{width:100%;height:100%;object-fit:cover;display:block}.av.d img{object-fit:contain;padding:10%}
.nm{padding:2px 12px;border-radius:999px;background:var(--glass);font-weight:800;font-size:.95rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Code */
#code,#wait{place-items:center;align-content:center;justify-items:center}
#code>*{width:min(90vw,760px)}
#codeIn{font-size:clamp(2.2rem,8vw,4.6rem);letter-spacing:.3em;padding:14px 0}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:clamp(1.4rem,4vw,2.4rem)}
.cam{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:2px solid var(--line)}
.cam svg{width:42px;height:42px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#code .fish,#wait .fish{position:absolute;left:3vw;bottom:3vh;width:clamp(120px,22vw,260px)}
#wait .fish{position:static;width:clamp(160px,30vw,320px)}
/* Profil */
#profile{grid-template-columns:auto minmax(0,1fr);align-content:center;gap:28px clamp(20px,5vw,70px);max-width:1100px;margin:0 auto;width:100%}
.left{display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.row .btn{padding:10px 22px 12px;font-size:1.2rem}
.right{display:flex;flex-direction:column;gap:22px;justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two .btn{padding:34px 10px 36px}
#pGo{justify-self:center}
#scan{position:fixed;inset:0;z-index:9;background:#000;display:none;place-items:center}#scan.on{display:grid}
#scan video{width:100%;height:100%;object-fit:cover}#scan .btn{position:absolute;bottom:30px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:10;max-width:90vw;background:#fff;color:#12264d;padding:10px 18px;border-radius:14px;font-weight:600;text-align:center;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#demo{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:6px}#demo button{padding:4px 12px;border-radius:999px;background:#0008;font-size:.8rem;font-weight:800}
@media (max-width:760px),(max-aspect-ratio:1/1){
#host{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;grid-template-areas:"q q" "c c" "l r" "b s"}.qr{width:min(52vw,34vh);justify-self:center}.side{align-content:start;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vh 3vw}.av{width:clamp(52px,17vw,90px)}.btn{padding:12px 18px 14px}#host .fish{display:none}
#profile{grid-template-columns:1fr}.two .btn{padding:22px 8px 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{animation:in .35s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
.bub{position:fixed;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(255,255,255,.15) 45%,rgba(255,255,255,.05) 70%);
  border:1px solid rgba(255,255,255,.45);animation:bubUp 1.6s ease-out forwards}
@keyframes bubUp{from{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.kick{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:1rem;font-weight:800;line-height:1;background:var(--glass);border:1.5px solid var(--line);color:#fff}
.kick:active{transform:scale(.9)}
#pvBox{margin:clamp(16px,4vh,40px)}
#pvBox .av{width:clamp(150px,30vh,300px);border-width:8px}
#profile{overflow-y:auto}
</style>
</head>
<body>
<section id="host" class="scr">
  <div class="side" id="sl"></div>
  <div class="qr" id="qr"></div>
  <div class="side" id="sr"></div>
  <div class="code glass" id="codeTxt">······</div>
  <button class="btn" id="hB">Retour</button>
  <img class="fish" src="spity-poisson-face.png" alt="">
  <button class="btn sun" id="hG">Démarrer</button>
</section>

<section id="code" class="scr">
  <a class="back glass" href="spity-accueil.html">← Accueil</a>
  <h2>Entrez le code</h2>
  <input class="in" id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······" aria-label="Code du salon">
  <div class="sc">Scannez<button class="cam" id="camB" aria-label="Scanner le QR code"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button></div>
  <img class="fish" src="spity-poisson-face.png" alt="">
</section>

<section id="profile" class="scr">
  <a class="back glass" href="spity-accueil.html">← Accueil</a>
  <div class="left">
    <div id="pvBox"></div>
    <div class="row"><button class="btn" id="phB">Photo</button><button class="btn" id="rmB">Supprimer</button><button class="btn" id="camPhB">Selfie</button></div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="fileCam" accept="image/*" capture="user" hidden>
  </div>
  <div class="right">
    <input class="in" id="pseudo" maxlength="14" placeholder="Pseudo" autocomplete="off" aria-label="Pseudo" style="font-size:clamp(1.6rem,4vw,2.6rem)">
    <div id="picker"></div>
    <button class="btn sun" id="pGo">Rejoindre le salon</button>
  </div>
</section>

<section id="wait" class="scr">
  <h2 id="wTxt">En attente<br>de l’hôte</h2>
  <img class="fish" src="spity-poisson-face.png" alt="">
  <button class="btn sun" id="wGo" hidden>Démarrer</button>
</section>

<div id="scan"><video id="vid" playsinline muted></video><button class="btn" id="scX">Fermer</button></div>
<input type="file" id="qrFile" accept="image/*" capture="environment" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="spity-avatar.js"></script>
<script>
var DEMO=false,PRE="spity-",FISH="spity-poisson-face.png";
function $(i){return document.getElementById(i)}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2400)}
function show(id){document.querySelectorAll(".scr").forEach(function(s){s.classList.toggle("on",s.id===id)});if(id==="code")$("codeIn").focus&&!DEMO&&$("codeIn").focus()}
document.querySelectorAll("[data-soon]").forEach(function(b){b.onclick=function(){toast("Bientôt : disponible avec la boutique.")}});

/* ---- Réseau : PeerJS (WebRTC) ; sinon canal local entre onglets (tests) ---- */
var peerOK=!!window.Peer&&!DEMO;
function hostNet(code,on){
  if(peerOK){var p=new Peer(PRE+code),cs={};
    p.on("open",on.open);p.on("error",on.error);
    p.on("connection",function(c){cs[c.peer]=c;c.on("data",function(m){on.msg(c.peer,m)});c.on("close",function(){delete cs[c.peer];on.leave(c.peer)})});
    return{all:function(m){for(var k in cs)cs[k].open&&cs[k].send(m)},close:function(){p.destroy()},
      kick:function(id){var c=cs[id];if(!c)return;c.open&&c.send({t:"kicked"});setTimeout(function(){c.close()},150)}}}
  var ch=new BroadcastChannel(PRE+code);
  ch.onmessage=function(e){var d=e.data;if(d.to!=="host")return;
    if(d.bye)on.leave(d.from);else if(d.m.t==="hello")ch.postMessage({to:d.from,m:{t:"welcome"}});else on.msg(d.from,d.m)};
  setTimeout(on.open,0);
  return{all:function(m){ch.postMessage({to:"*",m:m})},close:function(){ch.postMessage({to:"*",m:{t:"closed"}});ch.close()},
    kick:function(id){ch.postMessage({to:id,m:{t:"kicked"}})}}
}
function clientNet(code,on){
    if(peerOK){var p=new Peer(),c,ok=0;
    p.on("error",function(e){console.log(e);on.error(e)});
    p.on("open",function(){c=p.connect(PRE+code,{reliable:true});c.on("open",function(){ok=1;on.open()});c.on("data",on.msg);c.on("close",on.close)});
    setTimeout(function(){ok||on.error({type:"timeout"})},10000);
    return{send:function(m){c&&c.open&&c.send(m)},close:function(){p.destroy()}}}
  var id="c"+Math.random().toString(36).slice(2),ch=new BroadcastChannel(PRE+code),ok=0;
  ch.onmessage=function(e){var d=e.data;if(d.to!=="*"&&d.to!==id)return;
    if(d.m.t==="welcome"){ok=1;on.open()}else if(d.m.t==="closed")on.close();else on.msg(d.m)};
  ch.postMessage({to:"host",from:id,m:{t:"hello"}});setTimeout(function(){ok||on.error()},2000);
  addEventListener("pagehide",function(){ch.postMessage({to:"host",from:id,bye:1})});
  return{send:function(m){ch.postMessage({to:"host",from:id,m:m})},close:function(){ch.postMessage({to:"host",from:id,bye:1});ch.close()}}
}

/* ---- Écran de l'hôte ---- */
var P=[],shown={},H=null;
function img(s){return typeof s==="string"&&s.indexOf("data:image/")===0||s===FISH?s:""}
function fill(el,l){el.innerHTML="";l.forEach(function(p){
  var d=document.createElement("div"),n=document.createElement("div");
  d.className="pl"+(shown[p.id]?" old":"");n.className="nm";n.textContent=p.name;
  d.appendChild(Avatar.make(p));d.appendChild(n);
  var k=document.createElement("button");k.className="kick";k.textContent="✕";k.setAttribute("aria-label","Retirer "+p.name);k.onclick=function(){kick(p.id)};d.appendChild(k);
  el.appendChild(d);shown[p.id]=1})}
function render(){var L=[],R=[];P.forEach(function(p,i){(i%2?R:L).push(p)});fill($("sl"),L);fill($("sr"),R)}
function burst(el){
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(var i=0;i<14;i++){
    var b=document.createElement("span"),z=8+Math.random()*22;
    b.className="bub";
    b.style.cssText="left:"+(cx-z/2)+"px;top:"+(cy-z/2)+"px;width:"+z+"px;height:"+z+"px;--dx:"+((Math.random()-.5)*160)+"px;--dy:"+(-60-Math.random()*140)+"px;animation-delay:"+(Math.random()*.25)+"s";
    b.addEventListener("animationend",function(){this.remove()});
    document.body.appendChild(b);
  }
}
function kick(id){H&&H.kick&&H.kick(id);P=P.filter(function(x){return x.id!==id});delete shown[id];render();H&&H.all({t:"players",n:P.length})}
function addPlayer(p){if(P.length>=12||P.some(function(x){return x.id===p.id}))return;
    P.push({id:p.id,name:String(p.name||"Joueur").slice(0,14),avatar:p.avatar,ring:p.ring,contour:p.contour,acc:p.acc});render();
    var s=$((P.length-1)%2?"sr":"sl");burst(s.lastElementChild&&s.lastElementChild.querySelector(".av"));
  H&&H.all({t:"players",n:P.length})}
function startHost(tries){
  var code=String(Math.floor(100000+Math.random()*900000));
  H=hostNet(code,{
    open:function(){$("codeTxt").textContent=code.slice(0,3)+" "+code.slice(3);
      try{var q=qrcode(0,"M");q.addData(location.href.split("?")[0].split("#")[0]+"?code="+code);q.make();$("qr").innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true})}catch(e){$("qr").textContent=code}},
    error:function(e){if(e&&e.type==="unavailable-id"&&tries<3)startHost(tries+1);else toast("Connexion impossible. Vérifie Internet.")},
    msg:function(id,m){if(m&&m.t==="join")addPlayer({id:id,name:m.name,avatar:m.avatar,ring:m.ring,contour:m.contour,acc:m.acc})},
    leave:function(id){P=P.filter(function(x){return x.id!==id});delete shown[id];render()}});
}
$("hB").onclick=function(){H&&H.close();location.href="spity-accueil.html"};
$("hG").onclick=function(){toast("Bientôt : choix du jeu.")};

/* ---- Écrans du joueur ---- */
var CODE="",C=null,photo="";
function setCode(c){CODE=c;show("profile")}
$("codeIn").oninput=function(){this.value=this.value.replace(/\D/g,"").slice(0,6);if(this.value.length===6)setCode(this.value)};
function prev(){var b=$("pvBox");b.innerHTML="";b.appendChild(Avatar.make({avatar:photo,ring:"#ffffff",contour:Avatar.mine.contour,acc:Avatar.mine.acc}))}
Avatar.picker($("picker"),prev);prev();
$("phB").onclick=function(){$("file").click()};
$("camPhB").onclick=function(){$("fileCam").click()};
$("rmB").onclick=function(){photo="";$("file").value="";prev()};
$("file").onchange=$("fileCam").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=192;
  c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,192,192);photo=c.toDataURL("image/jpeg",.8);prev()};im.src=r.result};r.readAsDataURL(f)};
$("pGo").onclick=function(){var name=$("pseudo").value.trim();
  if(!name)return toast("Choisis un pseudo.");
  if(CODE.length!==6)return show("code");
  C&&C.close();
  C=clientNet(CODE,{open:function(){C.send({t:"join",name:name,avatar:photo,ring:"#ffffff",contour:Avatar.mine.contour,acc:Avatar.mine.acc});show("wait")},
    msg:function(m){if(m.t==="role")$("wGo").hidden=!m.chef;if(m.t==="start")toast("La partie démarre !");
      if(m.t==="kicked"){C.kicked=1;toast("Tu as été retiré du salon.");C.close();show("code")}},
    close:function(){if(!C.kicked)toast("Le salon a été fermé.");show("code")},
    error:function(){toast("Salon introuvable. Vérifie le code.");show("code")}})};
/* Scan du QR code avec la caméra */
var stream,scanning=0;
function stopScan(){scanning=0;$("scan").classList.remove("on");stream&&stream.getTracks().forEach(function(t){t.stop()})}
$("scX").onclick=stopScan;
$("qrFile").onchange=function(){var f=this.files[0];if(!f)return;var im=new Image();
  im.onload=function(){var k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*k;c.height=im.height*k;var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
    var r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height),m=r&&r.data.match(/(\d{6})\s*$/);
    URL.revokeObjectURL(im.src);m?setCode(m[1]):toast("QR code non reconnu. Réessaie ou entre le code.")};
  im.src=URL.createObjectURL(f);this.value=""};
$("camB").onclick=function(){
  if(!window.jsQR)return toast("Scan indisponible. Entre le code à la main.");
  if(!navigator.mediaDevices)return $("qrFile").click();
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
    stream=s;var v=$("vid");v.srcObject=s;v.play();$("scan").classList.add("on");scanning=1;
    var c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
    (function tick(){if(!scanning)return;
      if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
        var r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height),m=r&&r.data.match(/(\d{6})\s*$/);
        if(m){stopScan();setCode(m[1]);return}}
      requestAnimationFrame(tick)})()
  }).catch(function(){toast("Caméra refusée. Entre le code à la main.")})};

/* ---- Démarrage / navigation ---- */
var q=new URLSearchParams(location.search),mode=q.get("mode"),pre=(q.get("code")||"").replace(/\D/g,"").slice(0,6);
if(DEMO){
  var nav=document.createElement("div");nav.id="demo";
  [["host","Hôte"],["code","Code"],["profile","Profil"],["wait","Attente"]].forEach(function(a){var b=document.createElement("button");b.textContent=a[1];b.onclick=function(){show(a[0])};nav.appendChild(b)});
  document.body.appendChild(nav);show("host");startHost(0);
  var ring=["#ff7a59","#7a57f5","#34d9bc","#ffc23d","#ff6fa8"];
  ["Léa","Tom","Nora","Max","Zoé"].forEach(function(n,i){setTimeout(function(){addPlayer({id:"d"+i,name:n,avatar:"",ring:ring[i]})},1400+i*1100)});
}else if(pre.length===6)setCode(pre);
else if(mode==="join")show("code");
else{show("host");startHost(0)}
</script>
</body>
</html>
