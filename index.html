<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spity</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spity">
<meta name="theme-color" content="#21182D">
<link rel="stylesheet" href="app.css">
</head><body>
<header class="top">
  <div class="logo">spity</div>
  <input id="q" type="search" placeholder="Chercher un jeu" aria-label="Chercher un jeu">
  <button id="open-settings" class="icon" aria-label="Paramètres">⚙</button>
</header>
<main id="home"></main>
<div id="player" hidden>
  <button id="back" class="pill">‹ Spity</button>
  <iframe id="frame" title="Jeu" allow="autoplay; fullscreen"></iframe>
</div>
<aside id="settings" hidden>
  <div class="sheet">
    <h2>Paramètres</h2>
    <label><span>Thème clair</span><input type="checkbox" id="s-light"></label>
    <label><span>Sons</span><input type="checkbox" id="s-sound"></label>
    <label><span>Animations</span><input type="checkbox" id="s-anim"></label>
    <p class="muted">Spity v<span id="ver"></span> · ces réglages sont transmis aux jeux qui les gèrent.</p>
    <button id="close-settings" class="pill">Fermer</button>
  </div>
</aside>
<script src="games.js"></script>
<script src="app.js"></script>
</body></html>
