<style>

*{box-sizing:border-box}body{margin:0;background:var(--qbg);color:var(--qfg);font:15px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--qline);background:var(--qcard);color:var(--qfg);border-radius:13px;padding:10px 14px;font-weight:650}button.primary{background:linear-gradient(135deg,#7352A6,#B99BEA);color:#21182D;border:0}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;background:#1A1324;color:var(--qfg);border:1px solid var(--qline);border-radius:11px;padding:11px 12px;min-width:0}textarea{min-height:150px;resize:vertical}.wrap{max-width:1000px;margin:auto;padding:18px 18px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:900;font-size:26px;letter-spacing:-1px;color:var(--qlight)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button.active{background:#493565;border-color:var(--qlight);color:#fff}.panel{background:var(--qcard);border:1px solid var(--qline);border-radius:20px;padding:17px;margin:12px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:var(--qmuted);font-size:13px}.small{font-size:12px;color:var(--qmuted)}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--qmuted);font-weight:700}.player-row{display:grid;grid-template-columns:42px 1fr 40px;gap:8px;align-items:center;margin:8px 0}.avatar-btn{padding:3px;width:42px;height:42px;border-radius:50%;overflow:hidden}.avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}.mode{display:flex;flex-direction:column;gap:12px;min-height:190px}.mode .grow{flex:1}.tag{display:inline-block;border-radius:99px;padding:4px 9px;background:#493565;color:#e7d8ff;font-size:11px;font-weight:750}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.row>*{min-width:0}.qitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--qline)}.qitem img{width:62px;height:52px;object-fit:cover;border-radius:9px}.qitem .grow{flex:1;min-width:0}.qitem p{margin:2px 0}.game{min-height:100vh;display:flex;flex-direction:column}.gamehead{padding:12px 16px;border-bottom:1px solid var(--qline);display:flex;justify-content:space-between;gap:10px;align-items:center}.gamebody{width:min(900px,100%);margin:auto;padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.score{background:var(--qcard);border:1px solid var(--qline);border-radius:14px;padding:10px;text-align:center}.score.active{border:2px solid var(--qlight);box-shadow:0 0 18px #B99BEA44}.score img,.score .av{margin:0 auto 5px}.score strong{display:block;font-size:24px;color:var(--qlight)}.question{font-size:clamp(23px,4vw,36px);font-weight:850;text-align:center;line-height:1.2}.answerbox{background:#1b342a;border:1px solid #4b9b72;border-radius:16px;padding:16px;text-align:center}.qphoto{max-width:min(100%,460px);max-height:260px;object-fit:contain;border-radius:14px;display:block;margin:0 auto 12px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{min-width:130px}.good{background:#176c48;border-color:#2ba66d}.bad{background:#7b293d;border-color:#b84d66}.buzzer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.buzzer-grid button{min-height:64px;font-size:16px}.power{border:1px solid #a985e2;background:linear-gradient(120deg,#3b2855,#63418b);border-radius:16px;padding:14px;text-align:center;animation:powerIn .55s cubic-bezier(.2,.8,.2,1)}@keyframes powerIn{0%{opacity:0;transform:translateY(15px) scale(.88)}65%{transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:none}}.code{font-size:clamp(32px,8vw,54px);letter-spacing:7px;font-weight:950;color:var(--qlight);text-align:center}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#352748;border:1px solid var(--qlight);border-radius:12px;padding:11px 16px;z-index:100;max-width:90vw;display:none}.hidden{display:none!important}.preview{display:flex;gap:10px;flex-wrap:wrap}.preview img{max-height:90px;border-radius:10px}.turn-form{display:flex;gap:8px}.turn-form input{flex:1}.turn-form button{white-space:nowrap}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice-grid button{min-height:76px;font-size:18px;white-space:normal}
.choice-grid button.selected{outline:3px solid var(--qlight);background:#604581}
.choice-grid button.correct{background:#176c48;border-color:#2ba66d}
.choice-grid button.wrong{background:#7b293d;border-color:#b84d66}

@media(max-width:520px){.choice-grid{grid-template-columns:1fr}}
@media(max-width:650px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.wrap{padding:14px}.gamebody{padding:14px}.score{padding:8px 5px}.score strong{font-size:20px}}
</style></head><body>
<div id="app" class="wrap"></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch{return d}};
const notify=(s)=>{const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>t.style.display='none',3200)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const defaultSet={id:'default_set_1',name:'Culture générale',questions:[{text:'Quelle est la capitale de la Belgique ?',answer:'Bruxelles',category:'Géographie',difficulty:'facile'},{text:'Combien de côtés possède un hexagone ?',answer:'Six',category:'Sciences',difficulty:'facile'},{text:'Qui a peint la Joconde ?',answer:'Léonard de Vinci',category:'Art',difficulty:'moyenne'}]};
let localPlayers=read('quiz_players',['Joueur 1','Joueur 2','Joueur 3','Joueur 4']),localCount=Math.max(2,Math.min(10,Number(read('quiz_players_count',2))||2)),players=[],playersCount=0;
let questionSets=migrate(read('quiz_question_sets',[defaultSet])),settings={pts:1,pen:0,perGame:0,...read('quiz_settings',{})};let stats=read('quiz_stats',{games:0,players:{},history:[]});
let tab='play',selectedImage=null,generated=[];let mode=1,active=[],scores=[],qIndex=0,turn=0,buzzer=-1,answered=false,bonus=null,gameTimer=null,selectedChoices=[],choiceAnswers={},verdict=null,choiceResults=[],questionStarted=Date.now(),lobbyMode=3,lobbySet='',manageId='';
function newNet(){return{role:'none',peer:null,conn:null,connections:[],roomCode:'',assigned:-1,ready:{},remoteAnswer:null,started:false,players:[],view:'',lastQ:-1,sent:false,state:null,chef:null,rev:false}}let net=newNet();
const save=()=>{localStorage.setItem('quiz_players',JSON.stringify(localPlayers));localStorage.setItem('quiz_players_count',String(localCount));localStorage.setItem('quiz_question_sets',JSON.stringify(questionSets));localStorage.setItem('quiz_settings',JSON.stringify(settings));localStorage.setItem('quiz_stats',JSON.stringify(stats))};
function avatar(n,size=40){return window.SpityAvatar?SpityAvatar.html(n,size):`<span class="av" style="width:${size}px;height:${size}px">${esc(n[0]||'?')}</span>`}
function render(){if(net.role==='client')return renderClient();if(tab==='game')return renderGame();if(tab==='lobby')return renderLobby();$('app').innerHTML=`<header class="topbar"><div><div class="brand">spity / QUIZ TV</div><div class="small">Trois modes. Une seule ambiance.</div></div><nav class="nav"><button class="${tab==='play'?'active':''}" onclick="tab='play';render()">Jouer</button><button class="${tab==='bank'?'active':''}" onclick="tab='bank';render()">Questions</button><button class="${tab==='stats'?'active':''}" onclick="tab='stats';render()">Statistiques</button><button class="${tab==='settings'?'active':''}" onclick="tab='settings';render()">Réglages</button></nav></header>${tab==='play'?renderPlay():tab==='bank'?renderBank():tab==='stats'?renderStats():renderSettings()}`}
function renderPlay(){
const hosting=net.role==='host';
const roster=Array.from({length:localCount},(_,i)=>`<div class="player-row"><button class="avatar-btn" onclick="pickAvatar(${i})">${avatar(localPlayers[i],36)}</button><input id="player-${i}" value="${esc(localPlayers[i])}" onchange="setPlayer(${i},this.value)" placeholder="Joueur ${i+1}"><span class="small">${i+1}</span></div>`).join('');
return `${hosting?`<section class="panel" style="text-align:center"><h2>Salon ouvert · ${net.roomCode}</h2><button class="primary" onclick="tab='lobby';render()">Retourner au salon</button></section>`:''}<section class="panel"><div class="row"><div><h2>Joueurs sur cet écran</h2><p class="muted">Pour les modes « Sur cet écran » (2 à 10 joueurs). Les joueurs en ligne ne s'ajoutent pas ici.</p></div><div class="row"><button onclick="changeCount(-1)">−</button><b>${localCount}</b><button onclick="changeCount(1)">+</button></div></div>${roster}<button onclick="resetRoster()">Réinitialiser la liste des joueurs</button></section><h2>Choisis ton mode</h2><div class="grid2"><section class="panel mode"><div><span class="tag">MODE 01</span><h2>Tour par tour</h2><p class="muted">Chaque joueur reçoit une question à son tour. La réponse est validée par l'organisateur.</p></div><div class="grow field"><label>Dossier de questions classiques</label><select id="set-turn">${setOptions('classic')}</select></div><div class="grid2"><button class="primary" onclick="launch(1)">Sur cet écran</button><button onclick="openRoom(1)">Avec un code</button></div></section><section class="panel mode"><div><span class="tag">MODE 02</span><h2>Vitesse & buzzer</h2><p class="muted">Tout le monde peut buzzer. Le premier joueur prend la main.</p></div><div class="grow field"><label>Dossier de questions classiques</label><select id="set-buzz">${setOptions('classic')}</select></div><div class="grid2"><button class="primary" onclick="launch(2)">Sur cet écran</button><button onclick="openRoom(2)">Avec un code</button></div></section><section class="panel mode"><div><span class="tag">MODE 03</span><h2>Quiz rapide · QCM</h2><p class="muted">4 propositions par question, réponses sur téléphone uniquement. Les réponses rapides et exactes rapportent plus de points.</p></div><div class="grow field"><label>Dossier QCM</label><select id="set-choice">${setOptions('qcm')}</select></div><button class="primary" onclick="openRoom(3)">Créer un salon avec un code</button></section></div><section class="panel"><h2>Répondre sur son téléphone</h2><p class="muted">Un organisateur ouvre le salon, les autres rejoignent avec le code depuis leur téléphone. Le salon reste ouvert entre les parties.</p><button onclick="renderJoin()">Rejoindre une partie avec un code</button></section>`}
function setOptions(type){const l=questionSets.filter(s=>s.type===type);return l.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${(s.questions||[]).length} questions</option>`).join('')||`<option value="">Aucune bibliothèque ${type==='qcm'?'QCM':'classique'}</option>`}
function changeCount(d){localCount=Math.max(2,Math.min(10,localCount+d));save();render()};function setPlayer(i,v){const old=localPlayers[i],n=v.trim()||`Joueur ${i+1}`;if(old!==n&&window.SpityAvatar){const a=SpityAvatar.get(old);if(a){SpityAvatar.set(n,a);SpityAvatar.remove(old)}}localPlayers[i]=n;save();render()};function pickAvatar(i){SpityAvatar.pick(u=>{SpityAvatar.set(localPlayers[i],u);render()})}
function renderJoin(){tab='join';const last=read('quiz_last_join',{});$('app').innerHTML=`<div class="topbar"><div class="brand">spity / QUIZ TV</div><button onclick="tab='play';render()">Retour</button></div><section class="panel"><h1>Rejoindre une partie</h1><p class="muted">Entre le code affiché sur l'écran de l'organisateur et ton pseudo.</p><div class="field"><label>Code de la partie</label><input id="join-code" maxlength="6" placeholder="123456" inputmode="numeric" value="${esc(last.code||'')}"></div><div class="field"><label>Ton pseudo</label><input id="join-name" placeholder="Ton prénom" maxlength="18" value="${esc(last.name||'')}"></div><div class="field"><label>Photo de profil (facultative)</label><div class="player-profile"><button onclick="pickJoinAvatar()">Ajouter une photo</button><button onclick="removeJoinAvatar()">Retirer</button><span id="join-avatar-preview"></span></div></div><button class="primary" onclick="joinRoom()">Rejoindre</button></section>`}
function renderBank(){
if(!questionSets.some(x=>x.id===manageId))manageId=questionSets[0].id;
const s=currentSet(),qcm=s.type==='qcm';
const list=s.questions.map((q,i)=>`<div class="qitem">${q.image?`<img src="${q.image}">`:''}<div class="grow"><p><b>${esc(q.text)}</b></p><p class="small">${isQcm(q)?`${q.options.map((x,j)=>`${(q.correct||[]).includes(j)?'✅':'▫️'} ${String.fromCharCode(65+j)}. ${esc(x)}`).join(' · ')}`:`Réponse : ${esc(q.answer)}`}</p></div><button onclick="removeQuestion(${i})">✕</button></div>`).join('')||'<p class="muted">Aucune question.</p>';
const classicForm=`<h3>Ajouter une question</h3><div class="field"><label>Question</label><input id="new-q" placeholder="Énoncé de la question"></div><div class="field"><label>Réponse</label><input id="new-a" placeholder="Réponse attendue"></div><div class="field"><label>Photo facultative</label><input id="new-photo" type="file" accept="image/*" onchange="readQuestionPhoto(event)"><div id="photo-preview" class="preview">${selectedImage?`<img src="${selectedImage}">`:''}</div></div><button class="primary" onclick="addOne()">Ajouter la question</button><hr style="border-color:var(--qline);margin:20px 0"><h3>Importer beaucoup de questions d'un coup</h3><p class="muted">Une question par ligne, au format <b>question | réponse</b>. CSV accepté avec point-virgule, virgule ou tabulation.</p><textarea id="bulk-text" placeholder="Quelle est la capitale de la Belgique ? | Bruxelles&#10;Qui a peint la Joconde ? | Léonard de Vinci"></textarea><div class="row" style="margin-top:9px"><label class="small">Ou choisir un fichier TXT / CSV <input type="file" accept=".txt,.csv,text/plain,text/csv" onchange="readBulkFile(event)"></label><button class="primary" onclick="importBulk()">Importer la liste</button></div><p id="bulk-preview" class="muted"></p>`;
const qcmForm=`<h3>Créer une question QCM</h3><p class="muted">4 propositions par défaut (2 à 6 possible). Coche toutes les bonnes réponses.</p><div class="field"><label>Question</label><input id="mc-q" placeholder="Énoncé de la question"></div><div class="field"><label>Nombre de propositions</label><select id="mc-count" onchange="renderMcFields()"><option>4</option><option>2</option><option>3</option><option>5</option><option>6</option></select></div><div id="mc-fields">${mcFields(4)}</div><button class="primary" onclick="addChoiceQuestion()">Ajouter la question QCM</button>`;
return `<div class="row"><div><h1>Banque de questions</h1><p class="muted">Deux types de dossiers, non interchangeables : <b>classiques</b> (tour par tour, buzzer) et <b>QCM</b> (quiz rapide).</p></div><button onclick="tab='play';render()">Retour au jeu</button></div><section class="panel"><div class="row"><select onchange="manageId=this.value;render()">${questionSets.map(x=>`<option value="${esc(x.id)}" ${x.id===s.id?'selected':''}>${x.type==='qcm'?'🔘 QCM':'✏️ Classique'} · ${esc(x.name)}</option>`).join('')}</select><button onclick="newSet('classic')">+ Classique</button><button onclick="newSet('qcm')">+ QCM</button><button onclick="deleteSet()">Supprimer</button></div><div class="field"><label>Nom du dossier · ${qcm?'QCM':'classique'}</label><input id="set-name" value="${esc(s.name)}" onchange="renameSet(this.value)"></div>${qcm?qcmForm:classicForm}<h3 style="margin-top:20px">Questions du dossier (${s.questions.length})</h3>${list}</section><section class="panel"><h3>Générer avec Gemini (facultatif)</h3><p class="muted">${qcm?'Ce dossier est un QCM : l\u2019IA crée des questions avec exactement 4 propositions.':'Ce dossier est classique : l\u2019IA crée des questions avec une réponse courte.'} Clé API dans les réglages.</p><div class="field"><label>Thème</label><input id="ai-theme" placeholder="Ex. Géographie européenne"></div><div class="row"><input id="ai-count" type="number" min="1" max="30" value="10"><button class="primary" onclick="generateAI()">Générer</button></div><div id="ai-result"></div></section>`}
function mcFields(n){return Array.from({length:n},(_,i)=>`<div class="field"><label>Proposition ${i+1} ${i<2?'(obligatoire)':''}</label><div class="row"><input id="mc-opt-${i}" placeholder="Réponse ${i+1}"><label class="small"><input type="checkbox" id="mc-correct-${i}"> Bonne réponse</label></div></div>`).join('')}
function renderMcFields(){const n=Math.max(2,Math.min(6,Number($('mc-count').value)||4));$('mc-fields').innerHTML=mcFields(n)}
function addChoiceQuestion(){const s=currentSet(),text=$('mc-q')?.value.trim(),n=Number($('mc-count')?.value)||4,options=Array.from({length:n},(_,i)=>$('mc-opt-'+i)?.value.trim()||''),correct=Array.from({length:n},(_,i)=>$('mc-correct-'+i)?.checked?i:-1).filter(i=>i>=0);if(!s||s.type!=='qcm'||!text||options.some(x=>!x)||!correct.length)return notify('Complète la question, toutes les propositions et coche au moins une bonne réponse.');s.questions.push({text,options,correct,category:'Général',difficulty:'moyenne',target:'all'});save();render();notify('Question QCM ajoutée.')}
function currentSet(){return questionSets.find(s=>s.id===manageId)||questionSets[0]};function newSet(type){const n=prompt(type==='qcm'?'Nom du dossier QCM ?':'Nom du dossier classique ?');if(!n?.trim())return;const id='set_'+Date.now();questionSets.push({id,name:n.trim(),type,questions:[]});manageId=id;save();render()};function deleteSet(){const s=currentSet();if(!s||!confirm('Supprimer ce dossier ?'))return;questionSets=questionSets.filter(x=>x!==s);if(!questionSets.length)questionSets=[{id:'set_'+Date.now(),name:'Nouveau dossier',type:'classic',questions:[]}];manageId=questionSets[0].id;save();render()};function renameSet(n){const s=currentSet();if(s){s.name=n.trim()||s.name;save()}}function addOne(){const s=currentSet(),q=$('new-q').value.trim(),a=$('new-a').value.trim();if(!s||!q||!a)return notify('Complète la question et la réponse.');s.questions.push({text:q,answer:a,image:selectedImage||'',category:'Général',difficulty:'moyenne',target:'all'});selectedImage=null;save();render()};function removeQuestion(i){const s=currentSet();if(s){s.questions.splice(i,1);save();render()}}
function readQuestionPhoto(e){const f=e.target.files?.[0];if(!f)return;if(f.size>8*1024*1024)return notify('Image trop lourde (maximum 8 Mo).');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);selectedImage=c.toDataURL('image/jpeg',.78);$('photo-preview').innerHTML=`<img src="${selectedImage}"><button onclick="selectedImage=null;$('photo-preview').innerHTML='';">Retirer</button>`};im.src=r.result};r.readAsDataURL(f)}
function parseBulk(txt){const out=[];for(const line of txt.split(/\r?\n/)){const l=line.trim();if(!l||l.startsWith('#'))continue;let parts;if(l.includes('\t'))parts=l.split('\t');else if(l.includes('|'))parts=l.split('|');else if(l.includes(';'))parts=l.split(';');else parts=l.split(',');if(parts.length>=2){const q=parts.shift().trim().replace(/^"|"$/g,'');const a=parts.join(' ').trim().replace(/^"|"$/g,'');if(q&&a&&!((/^(question|énoncé|enonce)$/i).test(q)&&/^(réponse|reponse|answer)$/i.test(a)))out.push({text:q,answer:a,category:'Général',difficulty:'moyenne',target:'all'})}}return out}
function importBulk(){const s=currentSet(),qs=parseBulk($('bulk-text').value);if(!s)return;if(!qs.length)return notify('Aucune ligne valide. Utilise : question | réponse');s.questions.push(...qs);save();render();notify(`${qs.length} questions importées.`)}function readBulkFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bulk-text').value=r.result;$('bulk-preview').textContent=`${parseBulk(r.result).length} questions détectées.`};r.readAsText(f)}


async function generateAI(){
const s=currentSet(),qcm=s.type==='qcm',theme=$('ai-theme').value.trim(),key=settings.geminiKey;
if(!theme)return notify('Indique un thème.');if(!key)return notify('Ajoute ta clé Gemini dans les réglages.');
const n=Math.max(1,Math.min(qcm?20:30,Number($('ai-count').value)||10));
const prompt=qcm?`Crée ${n} questions de quiz à choix multiples en français sur le thème : ${theme}. Chaque question a EXACTEMENT 4 propositions courtes, distinctes et plausibles (les mauvaises réponses doivent être crédibles). "correct" contient les index (de 0 à 3) des bonnes propositions : le plus souvent une seule, parfois deux. Varie la position des bonnes réponses. Réponds uniquement en JSON conforme au schéma.`:`Génère ${n} questions de quiz en français sur ${theme}. Réponses courtes. JSON avec text et answer.`;
const schema=qcm?{type:'ARRAY',items:{type:'OBJECT',properties:{text:{type:'STRING'},options:{type:'ARRAY',items:{type:'STRING'},minItems:4,maxItems:4},correct:{type:'ARRAY',items:{type:'INTEGER'},minItems:1,maxItems:3}},required:['text','options','correct']}}:{type:'ARRAY',items:{type:'OBJECT',properties:{text:{type:'STRING'},answer:{type:'STRING'}},required:['text','answer']}};
$('ai-result').innerHTML='<p class="muted">Génération en cours…</p>';
try{
const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.geminiModel||'gemini-2.5-flash')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',responseSchema:schema}})});
const d=await resp.json();if(!resp.ok)throw Error(d.error?.message||'Erreur API');
const list=JSON.parse(d.candidates[0].content.parts[0].text);

function openRoom(m){

peer.on('open',()=>{if(net===me)render()});

conn.on('data',d=>{if(net===me)hostMessage(conn,d)});

function hostMessage(conn,d){
if(!d||typeof d!=='object')return;
const idx=conn.spityIndex,joined=typeof idx==='number'&&idx>=0;
if(d.type==='join'){
const name=String(d.name||'').trim().slice(0,18),rej=r=>conn.send({type:'reject',reason:r});
if(!name)return rej('Pseudo vide.');
const av=(typeof d.avatar==='string'&&d.avatar.length<80000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d.avatar))?d.avatar:'';

else{if(net.started)return rej('La partie a déjà commencé.');if(players.length>=10)return rej('Le salon est complet (10 joueurs maximum).');i=players.length;players.push(name);scores.push(0);playersCount=players.length}

conn.spityIndex=i;conn.send({type:'joined',index:i,players:players.slice(),name});

return}
if(!joined||!net.started||tab!=='game')return;
if(d.type==='cmd'&&idx===chefIdx()){chefDo(d.c);return}
if(d.type==='answer'&&mode===1&&idx===turn&&!answered&&!net.remoteAnswer){
const text=String(d.text||'').trim().slice(0,200);if(!text)return;
net.remoteAnswer={index:idx,text};net.rev=true;
$('answer-area').innerHTML=`<div class="answerbox"><b>Réponse de ${esc(players[turn])}</b><p>${esc(text)}</p><p class="small">Réponse attendue : <b>${esc(active[qIndex].answer)}</b></p></div>`;
$('game-controls').innerHTML=`<div class="controls"><button class="good" onclick="validate(true)">Bonne réponse</button><button class="bad" onclick="validate(false)">Mauvaise réponse</button></div>`;
broadcastState(true);return}
if(d.type==='buzz'&&mode===2){buzz(idx);return}

choiceAnswers[idx]={picked:(Array.isArray(d.picked)?d.picked:[]).map(Number).filter(Number.isInteger),at:Date.now()};
const g=$('got');if(g)g.textContent=`${Object.keys(choiceAnswers).length}/${connectedCount()} réponses reçues`;

function resolveChoices(){
if(answered||mode!==3)return;answered=true;
const q=active[qIndex],correct=q.correct||[];
choiceResults=players.map((n,i)=>{const a=choiceAnswers[i];if(!a)return{ok:false,points:0,none:true,picked:[]};
const ok=correct.length===a.picked.length&&correct.every(x=>a.picked.includes(x));
const el=Math.max(0,a.at-questionStarted),speed=Math.round(10*Math.exp(-el/6000));
const points=ok?Math.max(1,Number(settings.pts))+speed:0;if(ok)scores[i]+=points;
const rec=stats.players[n]||{games:0,wins:0,correct:0,answered:0};rec.answered++;if(ok)rec.correct++;stats.players[n]=rec;
return{ok,points,picked:a.picked}});
save();refreshScores();
$('game-controls').innerHTML=`<div class="choice-grid">${q.options.map((o,i)=>`<div class="answerbox" style="${correct.includes(i)?'':'background:var(--qcard);border-color:var(--qline);opacity:.65'}"><b>${String.fromCharCode(65+i)}</b> · ${esc(o)}</div>`).join('')}</div><div class="scores">${players.map((p,i)=>{const r=choiceResults[i];return `<div class="score">${avatar(p,30)}<span class="small">${esc(p)}</span><b>${r.none?'—':r.ok?'+'+r.points:'0'}</b></div>`}).join('')}</div><div class="controls"><button class="primary" onclick="nextQuestion()">Question suivante</button></div>`;
broadcastState(true)}
function broadcastState(showAnswer=false){const q=active[qIndex];if(!q)return;const hide=!!settings.hideQ;broadcast({type:'state',mode,qIndex,total:active.length,turn,buzzer,players:players.slice(),scores:scores.slice(),question:hide?'':q.text,options:(q.options||[]).map((o,i)=>hide?String.fromCharCode(65+i):o),image:hide?'':(q.image||q.photo||q.cover||''),answer:!hide&&mode!==3&&(showAnswer||answered)?q.answer:null,answered,answerText:hide?'':(net.remoteAnswer?.text||''),verdict,power:bonus,phase:answered?'result':showAnswer?'reveal':'question',correct:mode===3&&answered?q.correct:null,results:mode===3&&answered?choiceResults:null,got:Object.keys(choiceAnswers).length,hide,chef:chefIdx(),multi:mode===3&&(q.correct||[]).length>1})}

// ----- côté joueur (téléphone) -----
function renderClient(){$('app').innerHTML=`<div class="topbar"><div class="brand">spity / QUIZ TV</div><button onclick="leaveRoom()">Quitter</button></div><section class="panel"><h2>${avatar(net.playerName||'?',30)} ${esc(net.playerName||'')}</h2><div id="client-state"></div></section>`}
function leaveRoom(){if(!confirm('Quitter le salon ?'))return;netClose();tab='play';render()}
function renderClientWait(){const e=$('client-state');if(e)e.innerHTML=`<h3>Salle d’attente</h3><p class="muted">Tu es dans le salon. L’organisateur lance la prochaine partie, tu n’as rien à refaire.</p>${(net.players||[]).map(n=>`<p>${avatar(n,28)} ${esc(n)}</p>`).join('')}`}
function renderClientEnd(d){const e=$('client-state');if(!e)return;const best=Math.max(...d.scores);e.innerHTML=`<h2>Fin de partie</h2><p>${d.winners.length>1?'Égalité : ':'Vainqueur : '}<b>${esc(d.winners.join(', '))}</b></p><div class="scores">${d.players.map((n,i)=>`<div class="score ${d.scores[i]===best?'active':''}">${avatar(n,28)}<span class="small">${esc(n)}</span><strong>${d.scores[i]}</strong></div>`).join('')}</div><p class="muted">Le salon reste ouvert : en attente de la prochaine partie…</p>`}
function joinRoom(){
const code=$('join-code').value.replace(/\D/g,'').slice(0,6),name=$('join-name').value.trim();
if(code.length!==6||!name)return notify('Entre un code à 6 chiffres et ton pseudo.');
if(!window.Peer)return notify('Connexion indisponible : vérifie Internet.');
if(net.role!=='none')return;
localStorage.setItem('quiz_last_join',JSON.stringify({code,name}));
net=newNet();net.role='client';net.playerName=name;const me=net,peer=new Peer();net.peer=peer;
const fail=m=>{netClose();notify(m);renderJoin()};
peer.on('open',()=>{if(net!==me)return;const conn=peer.connect('spity-'+code,{reliable:true});me.conn=conn;
conn.on('open',()=>conn.send({type:'join',name,avatar:joinAvatar||window.SpityAvatar?.get(name)||null}));
conn.on('data',d=>{if(net===me)clientMessage(d)});
conn.on('close',()=>{if(net!==me)return;netClose();notify('Connexion au salon perdue.');tab='play';render()});
setTimeout(()=>{if(net===me&&net.assigned<0)fail('Salon introuvable. Vérifie le code.')},10000)});
peer.on('error',e=>{if(net!==me)return;fail(e.type==='peer-unavailable'?'Salon introuvable. Vérifie le code.':'Erreur de connexion : '+e.type)});
$('app').innerHTML='<section class="panel"><h2>Connexion…</h2><p class="muted">Recherche du salon.</p></section>'}
function clientMessage(d){
if(!d||net.role!=='client')return;
if(d.type==='reject'){const r=d.reason;netClose();notify(r);renderJoin();return}
if(d.type==='joined'){net.assigned=d.index;net.players=d.players;net.playerName=d.name||net.playerName;renderClient();renderClientWait();return}
if(d.type==='index'){net.assigned=d.index;net.players=d.players;return}
if(d.type==='lobby'){net.players=d.players;net.view='wait';renderClientWait();return}
if(d.type==='state'){net.view='state';net.state=d;renderClientState(d);return}
if(d.type==='end'){net.view='end';renderClientEnd(d);return}
if(d.type==='closed'){netClose();notify('Le salon a été fermé par l’organisateur.');tab='play';render();return}
if(d.type==='kicked'){netClose();notify('Tu as été retiré du salon.');tab='play';render()}}
function renderClientState(d){
if(net.role!=='client'||!$('client-state'))return;
const me=net.assigned;
if(net.lastQ!==d.qIndex){net.lastQ=d.qIndex;phoneChoices=[];net.sent=false}
const keep=$('phone-answer')?.value||'',hot=i=>d.mode===1?i===d.turn:d.mode===2?i===d.buzzer:false,verd=d.verdict===true||d.verdict===false;
let h=`<p class="small">Question ${d.qIndex+1}/${d.total}</p><div class="scores">${d.players.map((n,i)=>`<div class="score ${hot(i)?'active':''}">${avatar(n,28)}<span class="small">${esc(n)}${i===me?' (toi)':''}</span><strong>${d.scores[i]}</strong></div>`).join('')}</div>`;
if(d.power)h+=`<div class="power"><b>${esc(d.power.label)}</b><p>${esc(d.power.description)}</p></div>`;
h+=d.hide?'<h2 class="question">👀 Regarde l\'écran principal</h2>':`<h2 class="question">${esc(d.question)}</h2>`;
if(d.image)h+=`<img class="qphoto" src="${esc(d.image)}">`;
const reveal=()=>{let r='';if(d.answerText)r+=`<div class="answerbox"><b>${d.mode===1&&d.turn===me?'Ta réponse':'Réponse de '+esc(d.players[d.turn])}</b><p>${esc(d.answerText)}</p></div>`;if(d.answer)r+=`<div class="answerbox"><div class="small">RÉPONSE ATTENDUE</div><b>${esc(d.answer)}</b></div>`;if(verd)r+=`<p style="text-align:center"><b>${d.verdict?'✅ Bonne réponse':'❌ Mauvaise réponse'}</b></p>`;return r};
if(d.mode===1){
if(d.phase==='question')h+=d.turn===me?`<div class="power"><b>C’est à toi de répondre !</b></div><div class="turn-form"><input id="phone-answer" placeholder="Ta réponse" autocomplete="off"><button class="primary" onclick="sendPhoneAnswer()">Envoyer</button></div>`:`<p class="muted" style="text-align:center">C’est au tour de <b>${esc(d.players[d.turn])}</b>. Réfléchis de ton côté 😉</p>`;
else{h+=reveal();if(!verd&&d.turn===me&&d.answerText)h+='<p class="muted" style="text-align:center">Réponse envoyée. L’organisateur valide…</p>'}}
else if(d.mode===2){
if(d.buzzer<0&&d.phase==='question')h+=`<button class="primary" style="width:100%;min-height:90px;font-size:26px" onclick="sendPhoneBuzz()">BUZZER</button>`;
else if(d.buzzer>=0)h+=`<div class="power"><b>${d.buzzer===me?'Tu as la main ! Réponds à voix haute.':esc(d.players[d.buzzer])+' a buzzé'}</b></div>`;
h+=reveal()}
else{
if(d.phase==='question')h+=net.sent?`<p class="muted" style="text-align:center">Réponse envoyée ✔ En attente des autres joueurs (${d.got}/${d.players.length})</p>`:`<p class="small" style="text-align:center">${d.multi?'Plusieurs bonnes réponses : coche-les puis valide':'Touche ta réponse'}</p><div class="choice-grid">${d.options.map((o,i)=>`<button id="phone-choice-${i}" class="${phoneChoices.includes(i)?'selected':''}" onclick="togglePhoneChoice(${i})">${esc(o)}</button>`).join('')}</div>${d.multi?`<button class="primary" style="width:100%;margin-top:10px" onclick="sendPhoneChoices()">Valider</button>`:''}`;
else{const r=d.results?.[me]||{picked:[]};h+=`<div class="choice-grid">${d.options.map((o,i)=>`<button disabled class="${(d.correct||[]).includes(i)?'correct':r.picked.includes(i)?'wrong':''}">${esc(o)}</button>`).join('')}</div><div class="answerbox"><b>${r.none?'Pas de réponse':r.ok?'Bonne réponse':'Pas tout à fait'}</b><p>${r.ok?'+'+r.points+' points':'0 point'}</p></div>`}}
if(d.chef===me)h+=chefPanel(d);$('client-state').innerHTML=h;
const inp=$('phone-answer');if(inp&&keep)inp.value=keep}
function chefIdx(){if(net.chef==='')return -1;const i=net.chef?players.indexOf(net.chef):0;return i>=0&&i<players.length?i:(players.length?0:-1)}
function chefDo(c){if(tab!=='game')return;if(c==='next'&&answered)nextQuestion();else if(c==='skip'&&!answered)skipQuestion();else if(c==='reveal'&&!answered){if(mode===3)resolveChoices();else reveal()}else if((c==='good'||c==='bad')&&!answered&&net.rev&&mode!==3)validate(c==='good')}
function chefCmd(c){if(net.conn)net.conn.send({type:'cmd',c})}
function chefPanel(d){const b=(c,l,k='')=>`<button class="${k}" onclick="chefCmd('${c}')">${l}</button>`;let x;
if(d.phase==='result')x=b('next','Suivant ➜','primary');
else if(d.mode===3)x=b('reveal','Révéler maintenant','primary')+b('skip','Passer');
else if(d.phase==='reveal')x=b('good','✅ Bonne')+b('bad','❌ Mauvaise');
else x=b('reveal','Afficher la réponse','primary')+b('skip','Passer');
return `<div class="panel" style="margin-top:12px"><div class="tag">👑 CHEF</div><div class="controls" style="margin-top:8px">${x}</div></div>`}
function lobbyExtra(){const ci=chefIdx();return `<div class="field"><label>👑 Chef : passe à la suite depuis son téléphone (il joue quand même)</label><select onchange="net.chef=this.value"><option value="" ${ci<0?'selected':''}>Aucun (je gère depuis l’écran principal)</option>${players.map((n,i)=>`<option value="${esc(n)}" ${i===ci?'selected':''}>${esc(n)}</option>`).join('')}</select></div><label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${settings.hideQ?'checked':''} onchange="settings.hideQ=this.checked;save()"> Cacher questions et réponses sur les téléphones (obliger à regarder l’écran principal)</label>`}
let phoneChoices=[];
function togglePhoneChoice(i){if(net.sent)return;if(!net.state?.multi){phoneChoices=[i];return sendPhoneChoices()}const p=phoneChoices.indexOf(i);if(p>=0)phoneChoices.splice(p,1);else phoneChoices.push(i);document.querySelectorAll('[id^=phone-choice-]').forEach((b,j)=>b.classList.toggle('selected',phoneChoices.includes(j)))}
function sendPhoneChoices(){if(net.sent)return;if(!phoneChoices.length)return notify('Choisis au moins une proposition.');net.conn.send({type:'choices',picked:phoneChoices.slice(),qIndex:net.state?.qIndex});net.sent=true;renderClientState(net.state)}
function sendPhoneAnswer(){const el=$('phone-answer'),text=el?.value.trim();if(!text)return notify('Écris ta réponse.');net.conn.send({type:'answer',text});el.value='';notify('Réponse envoyée.')}
function sendPhoneBuzz(){net.conn.send({type:'buzz'})}

fillRoster();
render();
</script></body></html>
