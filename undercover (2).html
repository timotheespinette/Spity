<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Undercover</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
:root{--bg:#21182D;--p:#B99BEA;--m:#A66BFF;--g:#7cff6b;--r:#ff4d6d}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:#eef;font:500 18px/1.35 -apple-system,"SF Pro Rounded",system-ui,sans-serif;background:#21182D}
#app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:22px;padding:18px;box-shadow:0 0 24px rgba(185,155,234,.08)}
h1,h2{margin:.2em 0;text-shadow:0 0 14px var(--p)}h1{font-size:clamp(28px,5vw,46px)}h2{font-size:24px}
button{min-height:52px;min-width:52px;border:1px solid var(--p);background:rgba(185,155,234,.12);color:#fff;border-radius:16px;font:700 18px system-ui;padding:0 20px;box-shadow:0 0 14px rgba(185,155,234,.35)}
button:active{transform:scale(.96)}button:disabled{opacity:.35}
button.m{border-color:var(--m);background:rgba(166,107,255,.16);box-shadow:0 0 14px rgba(166,107,255,.45)}
.c{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.top{display:flex;align-items:center;gap:14px;padding-right:70px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(orientation:portrait){.g2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.row2{display:flex;gap:10px;margin-bottom:10px}
input{width:100%;min-height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;padding:0 14px;font-size:18px;margin:4px 0}
.inp{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.pl{min-height:68px}.pl.on{background:var(--m);box-shadow:0 0 22px var(--m)}
.chip{padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.big{font-size:clamp(34px,7vw,64px);font-weight:800;color:var(--p);text-shadow:0 0 20px var(--p)}
.big2{min-height:64px;font-size:22px;min-width:260px}
.card{width:min(420px,90%);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:800;border-radius:24px;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.card small{font-size:18px;font-weight:500}
.card.on{border:2px solid var(--g);box-shadow:0 0 30px var(--g);color:var(--g)}
.hold{min-height:80px;min-width:300px;font-size:22px;touch-action:none}
.tm{font-size:clamp(64px,14vw,120px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--p);text-shadow:0 0 24px var(--p)}
.tm.ur{color:var(--r);text-shadow:0 0 24px var(--r);animation:pu .5s infinite alternate}
@keyframes pu{to{transform:scale(1.1)}}
.mt{margin-top:18px}.lst{max-height:60vh;overflow:auto}.muted{opacity:.65;font-size:15px}
.flip{width:260px;height:340px;perspective:900px}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:fl 1s .6s forwards}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:30px}
.ff{background:linear-gradient(135deg,#4a2a80,#5b3f8f);border:2px solid var(--p);font-size:90px}
.fb{transform:rotateY(180deg);background:rgba(30,10,60,.9);border:2px solid var(--m);box-shadow:0 0 30px var(--m)}
@keyframes fl{to{transform:rotateY(180deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;animation:fi .4s 2s both}
@keyframes fi{from{opacity:0}}
table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
#mu{position:fixed;top:max(10px,env(safe-area-inset-top));right:14px;z-index:20;width:56px;height:56px;padding:0;font-size:24px;border-radius:50%}
.ap{display:flex;gap:8px;align-items:center}.ab{padding:0;min-width:52px;width:52px;border-radius:50%;overflow:hidden;flex:none}.ab+input{flex:1}.pl{display:flex;align-items:center;justify-content:center;gap:8px}.chip .av{margin-right:4px}
.sm{min-height:40px;min-width:40px;font-size:15px;padding:0 12px}
</style></head><body>
<button id="mu" data-a="mute">🔊</button><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="spity-avatar.js"></script>
<script>
const av=(n,s=44)=>SpityAvatar.html(n,s);
const $=s=>document.querySelector(s),ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const BASE="Chat|Chien;Café|Thé;Plage|Piscine;Pizza|Quiche;Vélo|Trottinette;Guitare|Violon;Pomme|Poire;Soleil|Lune;Train|Tramway;Avion|Hélicoptère;Football|Rugby;Cinéma|Théâtre;Lait|Crème;Beurre|Margarine;Montre|Horloge;Chaussette|Chaussure;Lunettes|Lentilles;Stylo|Crayon;Livre|Magazine;Piano|Orgue;Hôpital|Clinique;École|Université;Mer|Océan;Rivière|Fleuve;Forêt|Jungle;Voiture|Camion;Moto|Scooter;Roi|Empereur;Sorcier|Magicien;Pirate|Corsaire;Tigre|Lion;Loup|Renard;Fromage|Yaourt;Chocolat|Caramel;Glace|Sorbet;Bière|Vin;Douche|Bain;Savon|Shampoing;Brosse|Peigne;Canapé|Fauteuil;Lit|Hamac;Château|Palais;Pont|Tunnel;Tente|Caravane;Sac à dos|Valise;Ski|Snowboard;Noël|Nouvel An;Instagram|TikTok;Netflix|YouTube;Pompier|Policier".split(';').map(s=>s.split('|'));
const RL={c:'Civil',u:'Undercover',w:'Mr. White'};
const auto=n=>[Math.max(1,Math.floor(n/4)),n>=6?1:0];
const fresh=()=>({names:['','',''],ph:[],uc:1,mw:0,man:0});
const mk=()=>({role:'none',peer:null,conns:[],conn:null,code:'',idx:-1,name:'',photo:null,st:null,lj:'',sel:-1,lost:0,seen:{},votes:{}});
// Rien n'est conservé entre deux lancements, sauf : mots perso, scores, son, réglages (timer, clé, modèle)
['uc_cfg','uc_game'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
let set=Object.assign({timer:120,key:'',model:'gemini-3.6-flash'},ls('uc_set',{})),cfg=fresh(),custom=ls('uc_words',[]),scores=ls('uc_scores',{}),mute=ls('uc_mute',false);
let G=null,net=mk(),scr='home',msg='',gmsg='',gbusy=0,gv={n:10,t:''},jv={c:'',n:''},ujPhoto=null,lk='';
if(new URLSearchParams(location.search).get('sound')==='0')mute=true;
const alive=()=>G.players.map((p,i)=>p.alive?i:-1).filter(i=>i>=0);
const fixRoles=()=>{const n=cfg.names.length;if(!cfg.man||cfg.uc+cfg.mw>=n)[cfg.uc,cfg.mw]=auto(n)};
// ---------- AUDIO ----------
let AC;const au=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC};
function bp(f,d=.12,t='sine',v=.2,dl=0){if(mute)return;try{const a=au(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+dl;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={tick:()=>bp(880,.1,'square',.12),end:()=>bp(440,.7,'sawtooth',.2),flip:()=>{bp(300,.08,'triangle');bp(620,.1,'triangle',.2,.07)},win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>bp(f,.25,'triangle',.25,i*.14)),elim:()=>[400,300,200,120].forEach((f,i)=>bp(f,.22,'sawtooth',.2,i*.12))};
const mu=()=>$('#mu').textContent=mute?'🔇':'🔊';
// ---------- TIMER ----------
const tm={t:0,id:0,run:0},fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function tdraw(){const e=$('#tm');if(!e)return;e.textContent=fmt(tm.t);e.classList.toggle('ur',!!tm.run&&tm.t<=10&&tm.t>0);const g=$('#tg');if(g)g.textContent=tm.run?'⏸ Pause':'▶ Démarrer'}
function ttog(){if(tm.run){clearInterval(tm.id);tm.run=0}else{if(tm.t<=0)tm.t=set.timer;tm.run=1;tm.id=setInterval(()=>{tm.t--;if(tm.t<=10&&tm.t>0)sfx.tick();if(tm.t<=0){tm.t=0;clearInterval(tm.id);tm.run=0;sfx.end()}tdraw()},1000)}tdraw()}
function enterDebate(){G.phase='debate';G.order=shuf(alive());clearInterval(tm.id);tm.run=0;tm.t=set.timer;render()}
// ---------- VUES ----------
const rr=(l,k,v)=>`<div class=row><span>${l}</span><span><button data-a=r data-v="${k}-">−</button> <b>${v}</b> <button data-a=r data-v="${k}+">+</button></span></div>`;
const vHome=()=>`<div class=c><h1>🕵️ UNDERCOVER</h1><p>Trouve l'intrus parmi vous.</p><button class="m big2" data-a=setup>🎮 Partie sur cet appareil</button><button class=big2 data-a=ucroom>📱 Créer un salon (téléphones)</button><button class=big2 data-a=ucjoin>🔢 Rejoindre avec un code</button><div class=row><button data-a=words>📚 Mots</button><button data-a=scores>🏆 Scores</button></div><p>${esc(msg)}</p></div>`;
function vSetup(){const n=cfg.names.length,ci=n-cfg.uc-cfg.mw;return `<div class=top><button data-a=home>⬅</button><h1>Nouvelle partie</h1></div><div class=g2><div class=glass><div class=row><h2>Joueurs</h2><span><button data-a=np data-v=-1>−</button> <b>${n}</b> <button data-a=np data-v=1>+</button></span></div><div class=inp>${cfg.names.map((x,i)=>`<div class=ap><button class=ab data-a=av data-v=${i}>${cfg.ph[i]?`<img class=av src="${cfg.ph[i]}" width=52 height=52>`:'📷'}</button><input data-i=${i} maxlength=14 placeholder="Joueur ${i+1}" value="${esc(x)}">${cfg.ph[i]?`<button class=ab data-a=avx data-v=${i}>✕</button>`:''}</div>`).join('')}</div></div><div class=glass><h2>Rôles</h2>${rr('Civils','ci',ci)}${rr('Undercover','uc',cfg.uc)}${rr('Mr. White','mw',cfg.mw)}<div class=row><button data-a=auto>↺ Répartition auto</button></div><button class="m big2" data-a=start>▶ Lancer</button></div></div>`}
function vWords(){const m=['gemini-3.6-flash','gemini-3.6-pro','gemini-2.5-flash','gemini-2.5-pro'];return `<div class=top><button data-a=home>⬅</button><h1>Mots</h1></div><div class=g2><div><div class=glass><h2>Ajouter une paire</h2><div class=row2><input id=wc placeholder="Mot Civil"><input id=wu placeholder="Mot Undercover"></div><button data-a=wadd>＋ Ajouter</button><p class=muted>${esc(msg)}</p></div><div class="glass mt"><h2>✨ Générer avec Gemini</h2><input id=gk type=password autocomplete=off placeholder="Clé API Gemini" value="${esc(set.key)}"><input id=gm list=gl placeholder="Modèle" value="${esc(set.model)}"><datalist id=gl>${m.map(x=>`<option value="${x}">`).join('')}</datalist><div class=row2><input id=gn type=number min=1 max=40 value="${esc(gv.n)}" style="max-width:110px"><input id=gt placeholder="Thème (facultatif)" value="${esc(gv.t)}"></div><button class=m data-a=gen ${gbusy?'disabled':''}>✨ Générer</button><p id=gs class=muted>${esc(gmsg)}</p><p class=muted>Nombre de paires à ajouter. Aucun mot déjà présent n'est recréé.</p></div><div class="glass mt"><div class=row><button data-a=exp>⬇ Exporter</button><button data-a=imp>⬆ Importer</button></div><input id=fi type=file accept=".json,application/json" hidden></div></div><div class=glass><h2>Mes mots (${custom.length})</h2><p>+ ${BASE.length} paires de base</p><div class=lst>${custom.map((p,i)=>`<div class=row><span>${esc(p[0])} / ${esc(p[1])}</span><button data-a=wdel data-v=${i}>🗑</button></div>`).join('')||'<p>Aucun mot personnalisé.</p>'}</div></div></div>`}
function vScores(){const L=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return `<div class=top><button data-a=home>⬅</button><h1>🏆 Scores de la soirée</h1></div><div class=glass><table>${L.map(([n,s],i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${av(n,32)} ${esc(n)}</td><td><b>${s} pts</b></td></tr>`).join('')||'<tr><td>Aucune partie jouée.</td></tr>'}</table></div><div class=row><button class=m data-a=rs>Réinitialiser la soirée</button></div>`}
const isOn=i=>net.conns.some(c=>c.open&&c.ucIndex===i);
const H=()=>net.role=='host';
const vDeal=()=>{if(H()){const all=G.players.every((p,i)=>net.seen[i]);return `<div class=c><h1>Rôles distribués</h1><p>Chaque joueur maintient le bouton sur son téléphone pour voir son rôle.</p><div class=glass style=width:100%>${G.players.map((p,i)=>`<p>${av(p.n,28)} ${esc(p.n)} · ${net.seen[i]?'✅ rôle vu':isOn(i)?'⏳ n\'a pas encore regardé':'⚠️ déconnecté'}</p>`).join('')}</div><button class="m big2" data-a=ucdebate>${all?'Commencer le débat':'Commencer quand même'}</button><button class=sm data-a=home>Quitter</button></div>`}const p=G.players[G.i];return `<div class=c><small>Joueur ${G.i+1}/${G.players.length}</small><h2>Passe l'iPad à</h2><div class=big>${av(p.n,96)}<br>${esc(p.n)}</div><div id=card class=card>•••</div><button id=hold class="m hold">👁 Maintiens pour voir</button><button id=nx data-a=nx ${G.seen?'':'disabled'}>Suivant ➜</button></div>`};
function bindHold(){const b=$('#hold');if(!b)return;const p=G.players[G.i],c=$('#card');b.onpointerdown=e=>{e.preventDefault();c.innerHTML=p.r=='w'?'🎭 Mr. White<br><small>Pas de mot : bluffe !</small>':`<span style="font-size:clamp(30px,8vw,50px)">${esc(p.w)}</span>`;c.classList.add('on');if(!G.seen){G.seen=1;$('#nx').disabled=false}try{sfx.flip()}catch(x){}};const off=()=>{c.textContent='•••';c.classList.remove('on')};['pointerup','pointercancel','pointerleave'].forEach(ev=>b['on'+ev]=off);b.oncontextmenu=e=>e.preventDefault()}
const vDebate=()=>`<div class=top><button class=sm data-a=home>✕</button><h1>🗣 Débat — manche ${G.round}</h1></div><div class=g2><div class=glass><h2>Ordre de parole</h2><div class=gr>${G.order.map((i,k)=>`<div class=chip><b>${k+1}.</b> ${av(G.players[i].n,28)} ${esc(G.players[i].n)}</div>`).join('')}</div></div><div class="glass c"><div id=tm class=tm>${fmt(tm.t)}</div><div class=row><button data-a=tt data-v=-30>−30 s</button><button id=tg data-a=tg>▶ Démarrer</button><button data-a=tt data-v=30>+30 s</button></div><button class="m big2" data-a=tov>🗳 Passer au vote</button></div></div>`;
const grid=(l,a,s)=>`<div class=gr>${l.map(i=>`<button class="pl ${s==i?'on':''}" data-a=${a} data-v=${i}>${av(G.players[i].n,32)} ${esc(G.players[i].n)}</button>`).join('')}</div>`;
function vVote(){if(H()){const nv=Object.keys(net.votes).length;return `<div class=c><h2>🗳 Votes reçus</h2><div class=big>${nv} / ${alive().length}</div><div class=glass style=width:100%>${G.players.map((p,i)=>p.alive?`<p>${av(p.n,28)} ${esc(p.n)} · ${net.votes[i]!==undefined?'✅ a voté':isOn(i)?'⏳ en attente':'⚠️ déconnecté'}</p>`:'').join('')}</div><button class="m big2" data-a=force ${nv?'':'disabled'}>Dépouiller maintenant</button></div>`}
const V=G.vote;if(!V)return `<div class=c><h2>Comment voter ?</h2><button class=big2 data-a=vm data-v=s>🗳 Vote secret (Pass-the-iPad)</button><button class="m big2" data-a=vm data-v=d>👆 Élimination directe</button></div>`;
if(V.d)return `<div class=c><h2>Qui est éliminé ?</h2>${grid(alive(),'sel',V.sel)}<button class="m big2" data-a=kill ${V.sel>=0?'':'disabled'}>☠️ Éliminer</button></div>`;
const vi=V.l[V.k],p=G.players[vi];if(V.step=='pass')return `<div class=c><h2>Passe l'iPad à</h2><div class=big>${av(p.n,96)}<br>${esc(p.n)}</div><button class=big2 data-a=vp>Je suis ${esc(p.n)} — Voter</button></div>`;
return `<div class=c><h2>${esc(p.n)}, qui éliminer ?</h2>${grid(alive().filter(i=>i!=vi),'vc')}</div>`}
function vReveal(){const p=G.players[G.last],I={c:'🙂',u:'🕵️',w:'🎭'}[p.r],wait=p.r=='w'&&!G.gd;return `<div class=c>${G.tie?'<p>⚖️ Égalité : tirage au sort</p>':''}${av(p.n,96)}<h2>${esc(p.n)} est éliminé…</h2><div class=flip><div class=fc><div class=ff>?</div><div class=fb><span style="font-size:70px">${I}</span><b>${RL[p.r]}</b><small>${p.w?esc(p.w):''}</small></div></div></div>${wait&&!H()?`<div class=modal><div class="glass c"><h2>🎭 ${esc(p.n)}, devine le mot des Civils !</h2><input id=gs2 placeholder="Ton mot…" autocomplete=off><button class="m big2" data-a=guess>Valider</button></div></div>`:`${wait&&H()?'<p>En attente de la réponse de Mr. White sur son téléphone…</p><button class=sm data-a=skipg>Passer (il n\'a pas de réponse)</button>':''}${G.gd?'<p>❌ Mauvaise réponse !</p>':''}<button class=big2 data-a=cont ${wait&&H()?'disabled':''}>Continuer ➜</button>`}</div>`}
function vEnd(){const T={c:'🎉 Les Civils gagnent !',b:'🕵️ Les infiltrés gagnent !',w:'🎭 Mr. White a deviné le mot !'};return `<div class=c><h1>${T[G.res]}</h1><div class=glass style=width:100%><p>Civils : <b>${esc(G.cw)}</b> · Undercover : <b>${esc(G.uw)}</b></p><table>${G.players.map((p,i)=>`<tr><td>${av(p.n,32)} ${esc(p.n)}</td><td>${RL[p.r]}</td><td>${p.alive?'':'☠️'}</td><td>+${G.pts[i]}</td><td><b>${scores[p.n]||0} pts</b></td></tr>`).join('')}</table></div><div class=row><button class=m data-a=again>🔁 Rejouer</button>${H()?'<button data-a=lobby>↩ Salon</button>':''}<button data-a=scores>🏆 Scores</button><button data-a=home>Accueil</button></div></div>`}
function vLobby(){const n=cfg.names.length,ci=n-cfg.uc-cfg.mw;return `<div class=c><h1>Salon Undercover</h1><p>Sur leur téléphone : « Rejoindre avec un code ».</p><div class=glass style=width:min(500px,100%)><div class=tm>${net.code}</div><p>${n} joueur(s)</p><div style="text-align:left;margin:10px 0;max-height:25vh;overflow:auto">${cfg.names.map((x,i)=>`<div class=row style="justify-content:flex-start"><button class=sm data-a=kick data-v=${i}>✕</button> ${av(x,30)} ${esc(x)} <span>${isOn(i)?'🟢':'⚪'}</span></div>`).join('')||'<p>En attente des joueurs…</p>'}</div><hr style="border:0;border-top:1px solid rgba(255,255,255,.2);margin:15px 0">${rr('Civils','ci',Math.max(0,ci))}${rr('Undercover','uc',cfg.uc)}${rr('Mr. White','mw',cfg.mw)}<div class=row><button data-a=auto>↺ Répartition auto</button></div><p class=muted>Minimum 3 joueurs.</p><button class="m big2" data-a=start ${n<3?'disabled':''}>Distribuer les rôles</button></div><button data-a=home>Annuler</button></div>`}
